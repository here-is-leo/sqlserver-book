cture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SET\u003c/span> XACT_ABORT \u003cspan class=\"keyword\">ON\u003c/span>;\n\u003cspan class=\"keyword\">BEGIN\u003c/span> \u003cspan class=\"keyword\">TRAN\u003c/span>;\n\u003cspan class=\"keyword\">SAVE\u003c/span> \u003cspan class=\"keyword\">TRAN\u003c/span> BeforeDiscount;\n\u003cspan class=\"keyword\">UPDATE\u003c/span> Sales.Orders \u003cspan class=\"keyword\">SET\u003c/span> Discount=\u003cspan class=\"number\">0.10\u003c/span> \u003cspan class=\"keyword\">WHERE\u003c/span> OrderID=@OrderID;\n\u003cspan class=\"keyword\">IF\u003c/span> @Approved=\u003cspan class=\"number\">0\u003c/span> \u003cspan class=\"keyword\">ROLLBACK\u003c/span> \u003cspan class=\"keyword\">TRAN\u003c/span> BeforeDiscount;\n\u003cspan class=\"keyword\">COMMIT\u003c/span>;\u003c/div>"},{"id":32,"titleFa":"ویژگی‌های ACID","titleEn":"ACID Properties","tag":"transactions","topicsFa":["Atomicity و همه یا هیچ","Consistency و قواعد تجاری","Isolation و همزمانی","Durability و Transaction Log"],"topicsEn":["atomicity and all-or-nothing work","consistency and business rules","isolation and concurrency","durability and the transaction log"],"contentFa":"\n \u003cp>این فصل Atomicity و همه یا هیچ را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>Atomicity و همه یا هیچ\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>Consistency و قواعد تجاری\u003c/h3>\n \u003cp>Consistency و قواعد تجاری زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای Consistency و قواعد تجاری یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>Isolation و همزمانی\u003c/h3>\n \u003cp>در بحث Isolation و همزمانی، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>Durability و Transaction Log\u003c/h3>\n \u003cp>Durability و Transaction Log حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">BEGIN\u003c/span> \u003cspan class=\"keyword\">TRAN\u003c/span>;\n\u003cspan class=\"keyword\">UPDATE\u003c/span> Inventory.Stock \u003cspan class=\"keyword\">SET\u003c/span> Quantity=Quantity-@Qty \u003cspan class=\"keyword\">WHERE\u003c/span> ProductID=@ProductID \u003cspan class=\"keyword\">AND\u003c/span> Quantity&gt;=@Qty;\n\u003cspan class=\"keyword\">IF\u003c/span> @@ROWCOUNT=\u003cspan class=\"number\">0\u003c/span> \u003cspan class=\"keyword\">THROW\u003c/span> \u003cspan class=\"number\">50001\u003c/span>, \u003cspan class=\"string\">'Insufficient stock'\u003c/span>, \u003cspan class=\"number\">1\u003c/span>;\n\u003cspan class=\"keyword\">INSERT\u003c/span> Sales.OrderLine(OrderID,ProductID,Quantity) \u003cspan class=\"keyword\">VALUES\u003c/span>(@OrderID,@ProductID,@Qty);\n\u003cspan class=\"keyword\">COMMIT\u003c/span>;\u003c/div>","contentEn":"\n \u003cp>This chapter examines atomicity and all-or-nothing work from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>atomicity and all-or-nothing work\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>consistency and business rules\u003c/h3>\n \u003cp>consistency and business rules becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for consistency and business rules: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>isolation and concurrency\u003c/h3>\n \u003cp>When working with isolation and concurrency, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>durability and the transaction log\u003c/h3>\n \u003cp>durability and the transaction log connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">BEGIN\u003c/span> \u003cspan class=\"keyword\">TRAN\u003c/span>;\n\u003cspan class=\"keyword\">UPDATE\u003c/span> Inventory.Stock \u003cspan class=\"keyword\">SET\u003c/span> Quantity=Quantity-@Qty \u003cspan class=\"keyword\">WHERE\u003c/span> ProductID=@ProductID \u003cspan class=\"keyword\">AND\u003c/span> Quantity&gt;=@Qty;\n\u003cspan class=\"keyword\">IF\u003c/span> @@ROWCOUNT=\u003cspan class=\"number\">0\u003c/span> \u003cspan class=\"keyword\">THROW\u003c/span> \u003cspan class=\"number\">50001\u003c/span>, \u003cspan class=\"string\">'Insufficient stock'\u003c/span>, \u003cspan class=\"number\">1\u003c/span>;\n\u003cspan class=\"keyword\">INSERT\u003c/span> Sales.OrderLine(OrderID,ProductID,Quantity) \u003cspan class=\"keyword\">VALUES\u003c/span>(@OrderID,@ProductID,@Qty);\n\u003cspan class=\"keyword\">COMMIT\u003c/span>;\u003c/div>"},{"id":33,"titleFa":"سطوح ایزوله","titleEn":"Isolation Levels","tag":"transactions","topicsFa":["READ UNCOMMITTED و Dirty Read","READ COMMITTED و Repeatable Read","REPEATABLE READ و SERIALIZABLE","SNAPSHOT، RCSI و version store"],"topicsEn":["READ UNCOMMITTED and dirty reads","READ COMMITTED and repeatable reads","REPEATABLE READ and SERIALIZABLE","SNAPSHOT, RCSI, and the version store"],"contentFa":"\n \u003cp>این فصل READ UNCOMMITTED و Dirty Read را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>READ UNCOMMITTED و Dirty Read\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>READ COMMITTED و Repeatable Read\u003c/h3>\n \u003cp>READ COMMITTED و Repeatable Read زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای READ COMMITTED و Repeatable Read یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>REPEATABLE READ و SERIALIZABLE\u003c/h3>\n \u003cp>در بحث REPEATABLE READ و SERIALIZABLE، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>SNAPSHOT، RCSI و version store\u003c/h3>\n \u003cp>SNAPSHOT، RCSI و version store حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>سطح\u003c/th>\u003cth>Dirty Read\u003c/th>\u003cth>Nonrepeatable Read\u003c/th>\u003cth>Phantom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>READ UNCOMMITTED\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>Possible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>READ COMMITTED\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>Possible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REPEATABLE READ\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Possible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SERIALIZABLE\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Prevented\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SNAPSHOT\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Prevented in snapshot\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">ALTER\u003c/span> \u003cspan class=\"keyword\">DATABASE\u003c/span> SalesDb \u003cspan class=\"keyword\">SET\u003c/span> READ_COMMITTED_SNAPSHOT \u003cspan class=\"keyword\">ON\u003c/span> \u003cspan class=\"keyword\">WITH\u003c/span> \u003cspan class=\"keyword\">ROLLBACK\u003c/span> IMMEDIATE;\n\u003cspan class=\"keyword\">SET\u003c/span> \u003cspan class=\"keyword\">TRANSACTION\u003c/span> ISOLATION LEVEL SNAPSHOT;\n\u003cspan class=\"keyword\">BEGIN\u003c/span> \u003cspan class=\"keyword\">TRAN\u003c/span>;\n\u003cspan class=\"keyword\">SELECT\u003c/span> Balance \u003cspan class=\"keyword\">FROM\u003c/span> dbo.Account \u003cspan class=\"keyword\">WHERE\u003c/span> AccountID=\u003cspan class=\"number\">42\u003c/span>;\n\u003cspan class=\"keyword\">COMMIT\u003c/span>;\u003c/div>","contentEn":"\n \u003cp>This chapter examines READ UNCOMMITTED and dirty reads from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>READ UNCOMMITTED and dirty reads\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>READ COMMITTED and repeatable reads\u003c/h3>\n \u003cp>READ COMMITTED and repeatable reads becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for READ COMMITTED and repeatable reads: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>REPEATABLE READ and SERIALIZABLE\u003c/h3>\n \u003cp>When working with REPEATABLE READ and SERIALIZABLE, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>SNAPSHOT, RCSI, and the version store\u003c/h3>\n \u003cp>SNAPSHOT, RCSI, and the version store connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Dirty read\u003c/th>\u003cth>Nonrepeatable read\u003c/th>\u003cth>Phantom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>READ UNCOMMITTED\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>Possible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>READ COMMITTED\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>Possible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REPEATABLE READ\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Possible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SERIALIZABLE\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Prevented\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SNAPSHOT\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Prevented\u003c/td>\u003ctd>Prevented in snapshot\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">ALTER\u003c/span> \u003cspan class=\"keyword\">DATABASE\u003c/span> SalesDb \u003cspan class=\"keyword\">SET\u003c/span> READ_COMMITTED_SNAPSHOT \u003cspan class=\"keyword\">ON\u003c/span> \u003cspan class=\"keyword\">WITH\u003c/span> \u003cspan class=\"keyword\">ROLLBACK\u003c/span> IMMEDIATE;\n\u003cspan class=\"keyword\">SET\u003c/span> \u003cspan class=\"keyword\">TRANSACTION\u003c/span> ISOLATION LEVEL SNAPSHOT;\n\u003cspan class=\"keyword\">BEGIN\u003c/span> \u003cspan class=\"keyword\">TRAN\u003c/span>;\n\u003cspan class=\"keyword\">SELECT\u003c/span> Balance \u003cspan class=\"keyword\">FROM\u003c/span> dbo.Account \u003cspan class=\"keyword\">WHERE\u003c/span> AccountID=\u003cspan class=\"number\">42\u003c/span>;\n\u003cspan class=\"keyword\">COMMIT\u003c/span>;\u003c/div>"},{"id":34,"titleFa":"قفل‌ها و Deadlock","titleEn":"Locks & Deadlocks","tag":"transactions","topicsFa":["قفل Shared، Exclusive و Update","Granularity و Lock Escalation","تشخیص با Extended Events","تحلیل Deadlock Graph و پیشگیری"],"topicsEn":["shared, exclusive, and update locks","granularity and lock escalation","detection with Extended Events","deadlock graph analysis and prevention"],"contentFa":"\n \u003cp>این فصل قفل Shared، Exclusive و Update را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>قفل Shared، Exclusive و Update\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>Granularity و Lock Escalation\u003c/h3>\n \u003cp>Granularity و Lock Escalation زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای Granularity و Lock Escalation یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>تشخیص با Extended Events\u003c/h3>\n \u003cp>در بحث تشخیص با Extended Events، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>تحلیل Deadlock Graph و پیشگیری\u003c/h3>\n \u003cp>تحلیل Deadlock Graph و پیشگیری حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> EVENT SESSION DeadlockWatch \u003cspan class=\"keyword\">ON\u003c/span> SERVER\n\u003cspan class=\"keyword\">ADD\u003c/span> EVENT sqlserver.xml_deadlock_report\n\u003cspan class=\"keyword\">ADD\u003c/span> TARGET package0.event_file(\u003cspan class=\"keyword\">SET\u003c/span> filename=N\u003cspan class=\"string\">'C:\\XE\\deadlocks.xel'\u003c/span>);\n\u003cspan class=\"keyword\">ALTER\u003c/span> EVENT SESSION DeadlockWatch \u003cspan class=\"keyword\">ON\u003c/span> SERVER STATE=START;\u003c/div>","contentEn":"\n \u003cp>This chapter examines shared, exclusive, and update locks from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>shared, exclusive, and update locks\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>granularity and lock escalation\u003c/h3>\n \u003cp>granularity and lock escalation becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for granularity and lock escalation: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>detection with Extended Events\u003c/h3>\n \u003cp>When working with detection with Extended Events, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>deadlock graph analysis and prevention\u003c/h3>\n \u003cp>deadlock graph analysis and prevention connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> EVENT SESSION DeadlockWatch \u003cspan class=\"keyword\">ON\u003c/span> SERVER\n\u003cspan class=\"keyword\">ADD\u003c/span> EVENT sqlserver.xml_deadlock_report\n\u003cspan class=\"keyword\">ADD\u003c/span> TARGET package0.event_file(\u003cspan class=\"keyword\">SET\u003c/span> filename=N\u003cspan class=\"string\">'C:\\XE\\deadlocks.xel'\u003c/span>);\n\u003cspan class=\"keyword\">ALTER\u003c/span> EVENT SESSION DeadlockWatch \u003cspan class=\"keyword\">ON\u003c/span> SERVER STATE=START;\u003c/div>"},{"id":35,"titleFa":"Execution Plan — نقشه اجرا","titleEn":"Execution Plans","tag":"performance","topicsFa":["Estimated در برابر Actual Plan","Scan، Seek و Key Lookup","Sort، Hash Match و Nested Loops","هشدارها، فلش ضخیم و هزینه تخمینی"],"topicsEn":["estimated versus actual plans","scans, seeks, and key lookups","sort, hash match, and nested loops","warnings, thick arrows, and estimated cost"],"contentFa":"\n \u003cp>این فصل Estimated در برابر Actual Plan را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>Estimated در برابر Actual Plan\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>Scan، Seek و Key Lookup\u003c/h3>\n \u003cp>Scan، Seek و Key Lookup زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای Scan، Seek و Key Lookup یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>Sort، Hash Match و Nested Loops\u003c/h3>\n \u003cp>در بحث Sort، Hash Match و Nested Loops، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>هشدارها، فلش ضخیم و هزینه تخمینی\u003c/h3>\n \u003cp>هشدارها، فلش ضخیم و هزینه تخمینی حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SET\u003c/span> STATISTICS IO, TIME \u003cspan class=\"keyword\">ON\u003c/span>;\n\u003cspan class=\"keyword\">SELECT\u003c/span> CustomerID, OrderDate, TotalDue\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders\n\u003cspan class=\"keyword\">WHERE\u003c/span> CustomerID=\u003cspan class=\"number\">42\u003c/span> \u003cspan class=\"keyword\">AND\u003c/span> OrderDate&gt;=\u003cspan class=\"string\">'\u003cspan class=\"number\">2026\u003c/span>-\u003cspan class=\"number\">01\u003c/span>-\u003cspan class=\"number\">01\u003c/span>'\u003c/span>\n\u003cspan class=\"keyword\">OPTION\u003c/span> (RECOMPILE);\u003c/div>","contentEn":"\n \u003cp>This chapter examines estimated versus actual plans from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>estimated versus actual plans\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>scans, seeks, and key lookups\u003c/h3>\n \u003cp>scans, seeks, and key lookups becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for scans, seeks, and key lookups: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>sort, hash match, and nested loops\u003c/h3>\n \u003cp>When working with sort, hash match, and nested loops, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>warnings, thick arrows, and estimated cost\u003c/h3>\n \u003cp>warnings, thick arrows, and estimated cost connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SET\u003c/span> STATISTICS IO, TIME \u003cspan class=\"keyword\">ON\u003c/span>;\n\u003cspan class=\"keyword\">SELECT\u003c/span> CustomerID, OrderDate, TotalDue\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders\n\u003cspan class=\"keyword\">WHERE\u003c/span> CustomerID=\u003cspan class=\"number\">42\u003c/span> \u003cspan class=\"keyword\">AND\u003c/span> OrderDate&gt;=\u003cspan class=\"string\">'\u003cspan class=\"number\">2026\u003c/span>-\u003cspan class=\"number\">01\u003c/span>-\u003cspan class=\"number\">01\u003c/span>'\u003c/span>\n\u003cspan class=\"keyword\">OPTION\u003c/span> (RECOMPILE);\u003c/div>"},{"id":36,"titleFa":"Statistics و تخمین Cardinality","titleEn":"Statistics & Cardinality Estimation","tag":"performance","topicsFa":["Histogram و Density Vector","Auto Create و Auto Update Statistics","FULLSCAN در برابر Sample","نگهداری آمار و Ascending Key"],"topicsEn":["histograms and density vectors","automatic statistics creation and updates","FULLSCAN versus sampling","statistics maintenance and ascending keys"],"contentFa":"\n \u003cp>این فصل Histogram و Density Vector را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>Histogram و Density Vector\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>Auto Create و Auto Update Statistics\u003c/h3>\n \u003cp>Auto Create و Auto Update Statistics زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای Auto Create و Auto Update Statistics یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>FULLSCAN در برابر Sample\u003c/h3>\n \u003cp>در بحث FULLSCAN در برابر Sample، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>نگهداری آمار و Ascending Key\u003c/h3>\n \u003cp>نگهداری آمار و Ascending Key حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">UPDATE\u003c/span> STATISTICS Sales.Orders IX_Orders_Customer_Date \u003cspan class=\"keyword\">WITH\u003c/span> FULLSCAN;\n\u003cspan class=\"keyword\">SELECT\u003c/span> s.name, STATS_DATE(s.object_id,s.stats_id) \u003cspan class=\"keyword\">AS\u003c/span> LastUpdated\n\u003cspan class=\"keyword\">FROM\u003c/span> sys.stats s \u003cspan class=\"keyword\">WHERE\u003c/span> s.object_id=OBJECT_ID(\u003cspan class=\"string\">'Sales.Orders'\u003c/span>);\u003c/div>","contentEn":"\n \u003cp>This chapter examines histograms and density vectors from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>histograms and density vectors\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>automatic statistics creation and updates\u003c/h3>\n \u003cp>automatic statistics creation and updates becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for automatic statistics creation and updates: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>FULLSCAN versus sampling\u003c/h3>\n \u003cp>When working with FULLSCAN versus sampling, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>statistics maintenance and ascending keys\u003c/h3>\n \u003cp>statistics maintenance and ascending keys connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">UPDATE\u003c/span> STATISTICS Sales.Orders IX_Orders_Customer_Date \u003cspan class=\"keyword\">WITH\u003c/span> FULLSCAN;\n\u003cspan class=\"keyword\">SELECT\u003c/span> s.name, STATS_DATE(s.object_id,s.stats_id) \u003cspan class=\"keyword\">AS\u003c/span> LastUpdated\n\u003cspan class=\"keyword\">FROM\u003c/span> sys.stats s \u003cspan class=\"keyword\">WHERE\u003c/span> s.object_id=OBJECT_ID(\u003cspan class=\"string\">'Sales.Orders'\u003c/span>);\u003c/div>"},{"id":37,"titleFa":"Query Tuning — بهینه‌سازی کوئری","titleEn":"Query Tuning","tag":"performance","topicsFa":["Predicateهای SARGable","پرهیز از تابع روی ستون ایندکس","EXISTS، IN و JOIN در آزمون واقعی","حذف Key Lookup و Parameter Sniffing"],"topicsEn":["SARGable predicates","avoiding functions on indexed columns","benchmarking EXISTS, IN, and JOIN","eliminating key lookups and parameter sniffing"],"contentFa":"\n \u003cp>این فصل Predicateهای SARGable را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>Predicateهای SARGable\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>پرهیز از تابع روی ستون ایندکس\u003c/h3>\n \u003cp>پرهیز از تابع روی ستون ایندکس زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای پرهیز از تابع روی ستون ایندکس یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>EXISTS، IN و JOIN در آزمون واقعی\u003c/h3>\n \u003cp>در بحث EXISTS، IN و JOIN در آزمون واقعی، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>حذف Key Lookup و Parameter Sniffing\u003c/h3>\n \u003cp>حذف Key Lookup و Parameter Sniffing حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"comment\">-- SARGable range predicate\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> OrderID \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders\n\u003cspan class=\"keyword\">WHERE\u003c/span> OrderDate &gt;= \u003cspan class=\"string\">'\u003cspan class=\"number\">2026\u003c/span>-\u003cspan class=\"number\">09\u003c/span>-\u003cspan class=\"number\">01\u003c/span>'\u003c/span> \u003cspan class=\"keyword\">AND\u003c/span> OrderDate &lt; \u003cspan class=\"string\">'\u003cspan class=\"number\">2026\u003c/span>-\u003cspan class=\"number\">10\u003c/span>-\u003cspan class=\"number\">01\u003c/span>'\u003c/span>;\n\u003cspan class=\"comment\">-- Avoid: \u003cspan class=\"keyword\">WHERE\u003c/span> YEAR(OrderDate)=\u003cspan class=\"number\">2026\u003c/span> \u003cspan class=\"keyword\">AND\u003c/span> MONTH(OrderDate)=\u003cspan class=\"number\">9\u003c/span>\u003c/span>\u003c/div>","contentEn":"\n \u003cp>This chapter examines SARGable predicates from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>SARGable predicates\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>avoiding functions on indexed columns\u003c/h3>\n \u003cp>avoiding functions on indexed columns becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for avoiding functions on indexed columns: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>benchmarking EXISTS, IN, and JOIN\u003c/h3>\n \u003cp>When working with benchmarking EXISTS, IN, and JOIN, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>eliminating key lookups and parameter sniffing\u003c/h3>\n \u003cp>eliminating key lookups and parameter sniffing connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"comment\">-- SARGable range predicate\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> OrderID \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders\n\u003cspan class=\"keyword\">WHERE\u003c/span> OrderDate &gt;= \u003cspan class=\"string\">'\u003cspan class=\"number\">2026\u003c/span>-\u003cspan class=\"number\">09\u003c/span>-\u003cspan class=\"number\">01\u003c/span>'\u003c/span> \u003cspan class=\"keyword\">AND\u003c/span> OrderDate &lt; \u003cspan class=\"string\">'\u003cspan class=\"number\">2026\u003c/span>-\u003cspan class=\"number\">10\u003c/span>-\u003cspan class=\"number\">01\u003c/span>'\u003c/span>;\n\u003cspan class=\"comment\">-- Avoid: \u003cspan class=\"keyword\">WHERE\u003c/span> YEAR(OrderDate)=\u003cspan class=\"number\">2026\u003c/span> \u003cspan class=\"keyword\">AND\u003c/span> MONTH(OrderDate)=\u003cspan class=\"number\">9\u003c/span>\u003c/span>\u003c/div>"},{"id":38,"titleFa":"DMVها — نماهای مدیریت پویا","titleEn":"Dynamic Management Views","tag":"performance","topicsFa":["sys.dm_exec_requests","sys.dm_exec_query_stats","sys.dm_db_index_usage_stats","Missing Index DMVها و محدودیت آن‌ها"],"topicsEn":["sys.dm_exec_requests","sys.dm_exec_query_stats","sys.dm_db_index_usage_stats","missing-index DMVs and their limitations"],"contentFa":"\n \u003cp>این فصل sys.dm_exec_requests را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>sys.dm_exec_requests\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Inde
