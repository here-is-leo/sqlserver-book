 \u003cp>موضوع اول، \u003cstrong>ORDER BY چندستونی و عبارت‌ها\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>GROUP BY و HAVING\u003c/h3>\n \u003cp>GROUP BY و HAVING زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای GROUP BY و HAVING یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>ROLLUP و CUBE\u003c/h3>\n \u003cp>در بحث ROLLUP و CUBE، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>GROUPING SETS و گزارش‌های چندسطحی\u003c/h3>\n \u003cp>GROUPING SETS و گزارش‌های چندسطحی حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> Region, Category, SUM(Amount) \u003cspan class=\"keyword\">AS\u003c/span> TotalAmount\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.SalesFact\n\u003cspan class=\"keyword\">GROUP\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> GROUPING SETS ((Region, Category), (Region), ())\n\u003cspan class=\"keyword\">HAVING\u003c/span> SUM(Amount) &gt; \u003cspan class=\"number\">10000\u003c/span>\n\u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> Region, Category;\u003c/div>","contentEn":"\n \u003cp>This chapter examines multi-column ORDER BY and expressions from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>multi-column ORDER BY and expressions\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>GROUP BY and HAVING\u003c/h3>\n \u003cp>GROUP BY and HAVING becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for GROUP BY and HAVING: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>ROLLUP and CUBE\u003c/h3>\n \u003cp>When working with ROLLUP and CUBE, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>GROUPING SETS and multi-level reports\u003c/h3>\n \u003cp>GROUPING SETS and multi-level reports connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> Region, Category, SUM(Amount) \u003cspan class=\"keyword\">AS\u003c/span> TotalAmount\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.SalesFact\n\u003cspan class=\"keyword\">GROUP\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> GROUPING SETS ((Region, Category), (Region), ())\n\u003cspan class=\"keyword\">HAVING\u003c/span> SUM(Amount) &gt; \u003cspan class=\"number\">10000\u003c/span>\n\u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> Region, Category;\u003c/div>"},{"id":8,"titleFa":"توابع تجمیعی","titleEn":"Aggregate Functions","tag":"select","topicsFa":["COUNT، SUM، AVG، MIN و MAX","تفاوت COUNT ستاره، ستون و DISTINCT","STRING_AGG از نسخه 2017","توابع آماری و کنترل NULL"],"topicsEn":["COUNT, SUM, AVG, MIN, and MAX","COUNT star, column, and DISTINCT differences","STRING_AGG since SQL Server 2017","statistical functions and NULL handling"],"contentFa":"\n \u003cp>این فصل COUNT، SUM، AVG، MIN و MAX را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>COUNT، SUM، AVG، MIN و MAX\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>تفاوت COUNT ستاره، ستون و DISTINCT\u003c/h3>\n \u003cp>تفاوت COUNT ستاره، ستون و DISTINCT زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای تفاوت COUNT ستاره، ستون و DISTINCT یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>STRING_AGG از نسخه 2017\u003c/h3>\n \u003cp>در بحث STRING_AGG از نسخه 2017، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>توابع آماری و کنترل NULL\u003c/h3>\n \u003cp>توابع آماری و کنترل NULL حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> CustomerID,\n       COUNT(*) \u003cspan class=\"keyword\">AS\u003c/span> OrderCount,\n       COUNT(ShippedDate) \u003cspan class=\"keyword\">AS\u003c/span> ShippedCount,\n       COUNT(\u003cspan class=\"keyword\">DISTINCT\u003c/span> SalesPersonID) \u003cspan class=\"keyword\">AS\u003c/span> SellerCount,\n       STRING_AGG(CONVERT(varchar(max), OrderNumber), \u003cspan class=\"string\">', '\u003c/span>) \u003cspan class=\"keyword\">AS\u003c/span> Orders\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders\n\u003cspan class=\"keyword\">GROUP\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> CustomerID;\u003c/div>","contentEn":"\n \u003cp>This chapter examines COUNT, SUM, AVG, MIN, and MAX from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>COUNT, SUM, AVG, MIN, and MAX\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>COUNT star, column, and DISTINCT differences\u003c/h3>\n \u003cp>COUNT star, column, and DISTINCT differences becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for COUNT star, column, and DISTINCT differences: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>STRING_AGG since SQL Server 2017\u003c/h3>\n \u003cp>When working with STRING_AGG since SQL Server 2017, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>statistical functions and NULL handling\u003c/h3>\n \u003cp>statistical functions and NULL handling connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> CustomerID,\n       COUNT(*) \u003cspan class=\"keyword\">AS\u003c/span> OrderCount,\n       COUNT(ShippedDate) \u003cspan class=\"keyword\">AS\u003c/span> ShippedCount,\n       COUNT(\u003cspan class=\"keyword\">DISTINCT\u003c/span> SalesPersonID) \u003cspan class=\"keyword\">AS\u003c/span> SellerCount,\n       STRING_AGG(CONVERT(varchar(max), OrderNumber), \u003cspan class=\"string\">', '\u003c/span>) \u003cspan class=\"keyword\">AS\u003c/span> Orders\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders\n\u003cspan class=\"keyword\">GROUP\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> CustomerID;\u003c/div>"},{"id":9,"titleFa":"توابع رشته‌ای و عددی","titleEn":"String & Numeric Functions","tag":"select","topicsFa":["CONCAT، CONCAT_WS، LEN و DATALENGTH","SUBSTRING، LEFT، RIGHT و CHARINDEX","REPLACE، STUFF، TRANSLATE و TRIM","ROUND، CEILING، FLOOR، ABS و POWER"],"topicsEn":["CONCAT, CONCAT_WS, LEN, and DATALENGTH","SUBSTRING, LEFT, RIGHT, and CHARINDEX","REPLACE, STUFF, TRANSLATE, and TRIM","ROUND, CEILING, FLOOR, ABS, and POWER"],"contentFa":"\n \u003cp>این فصل CONCAT، CONCAT_WS، LEN و DATALENGTH را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>CONCAT، CONCAT_WS، LEN و DATALENGTH\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>SUBSTRING، LEFT، RIGHT و CHARINDEX\u003c/h3>\n \u003cp>SUBSTRING، LEFT، RIGHT و CHARINDEX زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای SUBSTRING، LEFT، RIGHT و CHARINDEX یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>REPLACE، STUFF، TRANSLATE و TRIM\u003c/h3>\n \u003cp>در بحث REPLACE، STUFF، TRANSLATE و TRIM، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>ROUND، CEILING، FLOOR، ABS و POWER\u003c/h3>\n \u003cp>ROUND، CEILING، FLOOR، ABS و POWER حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> CONCAT_WS(\u003cspan class=\"string\">' | '\u003c/span>, FirstName, LastName, Email) \u003cspan class=\"keyword\">AS\u003c/span> Label,\n       TRIM(REPLACE(Phone, \u003cspan class=\"string\">'-'\u003c/span>, \u003cspan class=\"string\">''\u003c/span>)) \u003cspan class=\"keyword\">AS\u003c/span> CleanPhone,\n       ROUND(Price * \u003cspan class=\"number\">1.09\u003c/span>, \u003cspan class=\"number\">2\u003c/span>) \u003cspan class=\"keyword\">AS\u003c/span> PriceWithTax\n\u003cspan class=\"keyword\">FROM\u003c/span> dbo.Contact;\u003c/div>","contentEn":"\n \u003cp>This chapter examines CONCAT, CONCAT_WS, LEN, and DATALENGTH from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>CONCAT, CONCAT_WS, LEN, and DATALENGTH\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>SUBSTRING, LEFT, RIGHT, and CHARINDEX\u003c/h3>\n \u003cp>SUBSTRING, LEFT, RIGHT, and CHARINDEX becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for SUBSTRING, LEFT, RIGHT, and CHARINDEX: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>REPLACE, STUFF, TRANSLATE, and TRIM\u003c/h3>\n \u003cp>When working with REPLACE, STUFF, TRANSLATE, and TRIM, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>ROUND, CEILING, FLOOR, ABS, and POWER\u003c/h3>\n \u003cp>ROUND, CEILING, FLOOR, ABS, and POWER connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> CONCAT_WS(\u003cspan class=\"string\">' | '\u003c/span>, FirstName, LastName, Email) \u003cspan class=\"keyword\">AS\u003c/span> Label,\n       TRIM(REPLACE(Phone, \u003cspan class=\"string\">'-'\u003c/span>, \u003cspan class=\"string\">''\u003c/span>)) \u003cspan class=\"keyword\">AS\u003c/span> CleanPhone,\n       ROUND(Price * \u003cspan class=\"number\">1.09\u003c/span>, \u003cspan class=\"number\">2\u003c/span>) \u003cspan class=\"keyword\">AS\u003c/span> PriceWithTax\n\u003cspan class=\"keyword\">FROM\u003c/span> dbo.Contact;\u003c/div>"},{"id":10,"titleFa":"مفهوم JOIN و انواع آن","titleEn":"JOIN Concept & Types","tag":"joins","topicsFa":["INNER، LEFT، RIGHT و FULL OUTER JOIN","CROSS JOIN و SELF JOIN","مدل ذهنی مجموعه‌ها و تطبیق کلیدها","الگوریتم‌های Nested Loops، Merge و Hash"],"topicsEn":["INNER, LEFT, RIGHT, and FULL OUTER JOIN","CROSS JOIN and SELF JOIN","set-based mental models and key matching","Nested Loops, Merge, and Hash algorithms"],"contentFa":"\u003cpre class=\"venn\" aria-label=\"Join set diagram\">INNER: A ∩ B     LEFT: A + (A ∩ B)     FULL: A ∪ B\n[A]──matched keys──[B]   unmatched rows become NULL\u003c/pre>\n \u003cp>این فصل INNER، LEFT، RIGHT و FULL OUTER JOIN را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>INNER، LEFT، RIGHT و FULL OUTER JOIN\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>CROSS JOIN و SELF JOIN\u003c/h3>\n \u003cp>CROSS JOIN و SELF JOIN زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای CROSS JOIN و SELF JOIN یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>مدل ذهنی مجموعه‌ها و تطبیق کلیدها\u003c/h3>\n \u003cp>در بحث مدل ذهنی مجموعه‌ها و تطبیق کلیدها، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>الگوریتم‌های Nested Loops، Merge و Hash\u003c/h3>\n \u003cp>الگوریتم‌های Nested Loops، Merge و Hash حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>نوع JOIN\u003c/th>\u003cth>خروجی\u003c/th>\u003cth>کاربرد رایج\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>INNER\u003c/td>\u003ctd>Matched rows\u003c/td>\u003ctd>Required relationships\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LEFT\u003c/td>\u003ctd>All left + matches\u003c/td>\u003ctd>Optional relationships\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FULL\u003c/td>\u003ctd>All rows from both\u003c/td>\u003ctd>Reconciliation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CROSS\u003c/td>\u003ctd>Cartesian product\u003c/td>\u003ctd>Combinations\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> o.OrderID, c.CustomerName, p.PaymentAmount\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">AS\u003c/span> o\n\u003cspan class=\"keyword\">INNER\u003c/span> \u003cspan class=\"keyword\">JOIN\u003c/span> Sales.Customers \u003cspan class=\"keyword\">AS\u003c/span> c \u003cspan class=\"keyword\">ON\u003c/span> c.CustomerID = o.CustomerID\n\u003cspan class=\"keyword\">LEFT\u003c/span> \u003cspan class=\"keyword\">JOIN\u003c/span> Sales.Payments \u003cspan class=\"keyword\">AS\u003c/span> p \u003cspan class=\"keyword\">ON\u003c/span> p.OrderID = o.OrderID;\u003c/div>","contentEn":"\u003cpre class=\"venn\" aria-label=\"Join set diagram\">INNER: A ∩ B     LEFT: A + (A ∩ B)     FULL: A ∪ B\n[A]──matched keys──[B]   unmatched rows become NULL\u003c/pre>\n \u003cp>This chapter examines INNER, LEFT, RIGHT, and FULL OUTER JOIN from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>INNER, LEFT, RIGHT, and FULL OUTER JOIN\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>CROSS JOIN and SELF JOIN\u003c/h3>\n \u003cp>CROSS JOIN and SELF JOIN becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for CROSS JOIN and SELF JOIN: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>set-based mental models and key matching\u003c/h3>\n \u003cp>When working with set-based mental models and key matching, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>Nested Loops, Merge, and Hash algorithms\u003c/h3>\n \u003cp>Nested Loops, Merge, and Hash algorithms connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Join\u003c/th>\u003cth>Returns\u003c/th>\u003cth>Typical use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>INNER\u003c/td>\u003ctd>Matched rows\u003c/td>\u003ctd>Required relationships\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LEFT\u003c/td>\u003ctd>All left + matches\u003c/td>\u003ctd>Optional relationships\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FULL\u003c/td>\u003ctd>All rows from both\u003c/td>\u003ctd>Reconciliation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CROSS\u003c/td>\u003ctd>Cartesian product\u003c/td>\u003ctd>Combinations\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> o.OrderID, c.CustomerName, p.PaymentAmount\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">AS\u003c/span> o\n\u003cspan class=\"keyword\">INNER\u003c/span> \u003cspan class=\"keyword\">JOIN\u003c/span> Sales.Customers \u003cspan class=\"keyword\">AS\u003c/span> c \u003cspan class=\"keyword\">ON\u003c/span> c.CustomerID = o.CustomerID\n\u003cspan class=\"keyword\">LEFT\u003c/span> \u003cspan class=\"keyword\">JOIN\u003c/span> Sales.Payments \u003cspan class=\"keyword\">AS\u003c/span> p \u003cspan class=\"keyword\">ON\u003c/span> p.OrderID = o.OrderID;\u003c/div>"},{"id":11,"titleFa":"JOINهای پیشرفته","titleEn":"Advanced Joins","tag":"joins","topicsFa":["JOIN سه جدول و بیشتر","ترتیب منطقی و فیزیکی JOINها","JOIN با CTE و derived table","semi-join و anti-join با EXISTS"],"topicsEn":["joining three or more tables","logical and physical join order","joins with CTEs and derived tables","semi-joins and anti-joins with EXISTS"],"contentFa":"\n \u003cp>این فصل JOIN سه جدول و بیشتر را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>JOIN سه جدول و بیشتر\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>ترتیب منطقی و فیزیکی JOINها\u003c/h3>\n \u003cp>ترتیب منطقی و فیزیکی JOINها زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای ترتیب منطقی و فیزیکی JOINها یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>JOIN با CTE و derived table\u003c/h3>\n \u003cp>در بحث JOIN با CTE و derived table، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>semi-join و anti-join با EXISTS\u003c/h3>\n \u003cp>semi-join و anti-join با EXISTS حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> c.CustomerID, c.CustomerName\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Customers \u003cspan class=\"keyword\">AS\u003c/span> c\n\u003cspan class=\"keyword\">WHERE\u003c/span> \u003cspan class=\"keyword\">EXISTS\u003c/span> (\u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"number\">1\u003c/span> \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">AS\u003c/span> o \u003cspan class=\"keyword\">WHERE\u003c/span> o.CustomerID = c.CustomerID)\n  \u003cspan class=\"keyword\">AND\u003c/span> \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">EXISTS\u003c/span> (\u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"number\">1\u003c/span> \u003cspan class=\"keyword\">FROM\u003c/span> Sales.\u003cspan class=\"keyword\">Returns\u003c/span> \u003cspan class=\"keyword\">AS\u003c/span> r \u003cspan class=\"keyword\">WHERE\u003c/span> r.CustomerID = c.CustomerID);\u003c/div>","contentEn":"\n \u003cp>This chapter examines joining three or more tables from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>joining three or more tables\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>logical and physical join order\u003c/h3>\n \u003cp>logical and physical join order becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for logical and physical join order: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>joins with CTEs and derived tables\u003c/h3>\n \u003cp>When working with joins with CTEs and derived tables, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>semi-joins and anti-joins with EXISTS\u003c/h3>\n \u003cp>semi-joins and anti-joins with EXISTS connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> c.CustomerID, c.CustomerName\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Customers \u003cspan class=\"keyword\">AS\u003c/span> c\n\u003cspan class=\"keyword\">WHERE\u003c/span> \u003cspan class=\"keyword\">EXISTS\u003c/span> (\u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"number\">1\u003c/span> \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">AS\u003c/span> o \u003cspan class=\"keyword\">WHERE\u003c/span> o.CustomerID = c.CustomerID)\n  \u003cspan class=\"keyword\">AND\u003c/span> \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">EXISTS\u003c/span> (\u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"number\">1\u003c/span> \u003cspan class=\"keyword\">FROM\u003c/span> Sales.\u003cspan class=\"keyword\">Returns\u003c/span> \u003cspan class=\"keyword\">AS\u003c/span> r \u003cspan class=\"keyword\">WHERE\u003c/span> r.CustomerID = c.CustomerID);\u003c/div>"},{"id":12,"titleFa":"UNION، INTERSECT و EXCEPT","titleEn":"Set Operations","tag":"joins","topicsFa":["UNION در برابر UNION ALL","قواعد تعداد ستون و نوع داده","INTERSECT و EXCEPT","NULL، مرتب‌سازی و هزینه حذف تکراری‌ها"],"topicsEn":["UNION versus UNION ALL","column-count and data-type rules","INTERSECT and EXCEPT","NULLs, sorting, and duplicate-removal cost"],"contentFa":"\n \u003cp>این فصل UNION در برابر UNION ALL را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>UNION در برابر UNION ALL\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>قواعد تعداد ستون و نوع داده\u003c/h3>\n \u003cp>قواعد تعداد ستون و نوع داده زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای قواعد تعداد ستون و نوع داده یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>INTERSECT و EXCEPT\u003c/h3>\n \u003cp>در بحث INTERSECT و EXCEPT، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>NULL، مرتب‌سازی و هزینه حذف تکراری‌ها\u003c/h3>\n \u003cp>NULL، مرتب‌سازی و هزینه حذف تکراری‌ها حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> Email \u003cspan class=\"keyword\">FROM\u003c/span> CRM.Customers\n\u003cspan class=\"keyword\">UNION\u003c/span> \u003cspan class=\"keyword\">ALL\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> Email \u003cspan class=\"keyword\">FROM\u003c/span> Marketing.Leads;\n\n\u003cspan class=\"keyword\">SELECT\u003c/span> ProductID \u003cspan class=\"keyword\">FROM\u003c/span> Sales.OrderLines\n\u003cspan class=\"keyword\">INTERSECT\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> ProductID \u003cspan class=\"keyword\">FROM\u003c/span> Warehouse.Stock;\u003c/div>","contentEn":"\n \u003cp>This chapter examines UNION versus UNION ALL from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>UNION versus UNION ALL\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>column-count and data-type rules\u003c/h3>\n \u003cp>column-count and data-type rules becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for column-count and data-type rules: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>INTERSECT and EXCEPT\u003c/h3>\n \u003cp>When working with INTERSECT and EXCEPT, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>NULLs, sorting, and duplicate-removal cost\u003c/h3>\n \u003cp>NULLs, sorting, and duplicate-removal cost connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> Email \u003cspan class=\"keyword\">FROM\u003c/span> CRM.Customers\n\u003cspan class=\"keyword\">UNION\u003c/span> \u003cspan class=\"keyword\">ALL\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> Email \u003cspan class=\"keyword\">FROM\u003c/span> Marketing.Leads;\n\n\u003cspan class=\"keyword\">SELECT\u003c/span> ProductID \u003cspan class=\"keyword\">FROM\u003c/span> Sales.OrderLines\n\u003cspan class=\"keyword\">INTERSECT\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> ProductID \u003cspan class=\"keyword\">FROM\u003c/span> Warehouse.Stock;\u003c/div>"},{"id":13,"titleFa":"Self-Join و سلسله‌مراتب","titleEn":"Self-Joins & Hierarchies","tag":"joins","topicsFa":["رابطه کارمند و مدیر","Self-Join برای سطوح ثابت","Recursive CTE برای درخت سازمانی","مسیر، عمق و جلوگیری از چرخه"],"topicsEn":["employee-manager relationships","self-joins for fixed levels","recursive CTEs for organization trees","paths, depth, and cycle prevention"],"contentFa":"\n \u003cp>این فصل رابطه کارمند و مدیر را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>رابطه کارمند و مدیر\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>Self-Join برای سطوح ثابت\u003c/h3>\n \u003cp>Self-Join برای سطوح ثابت زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای Self-Join برای سطوح ثابت یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>Recursive CTE برای درخت سازمانی\u003c/h3>\n \u003cp>در بحث Recursive CTE برای درخت سازمانی، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>مسیر، عمق و جلوگیری از چرخه\u003c/h3>\n \u003cp>مسیر، عمق و جلوگیری از چرخه حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u0
