ntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>DELETE, TRUNCATE, and DROP differences\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>DELETE with JOIN\u003c/h3>\n \u003cp>DELETE with JOIN becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for DELETE with JOIN: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>soft deletes and global filtering\u003c/h3>\n \u003cp>When working with soft deletes and global filtering, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>logging, locking, and rollback\u003c/h3>\n \u003cp>logging, locking, and rollback connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>Rows logged\u003c/th>\u003cth>WHERE\u003c/th>\u003cth>Structure remains\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DELETE\u003c/td>\u003ctd>Row operations\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TRUNCATE\u003c/td>\u003ctd>Page deallocation\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DROP\u003c/td>\u003ctd>Object removal\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">UPDATE\u003c/span> Sales.Customer \u003cspan class=\"keyword\">SET\u003c/span> IsDeleted = \u003cspan class=\"number\">1\u003c/span>, DeletedAt = SYSUTCDATETIME() \u003cspan class=\"keyword\">WHERE\u003c/span> CustomerID = @CustomerID;\n\n\u003cspan class=\"keyword\">DELETE\u003c/span> ol\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.OrderLine \u003cspan class=\"keyword\">AS\u003c/span> ol\n\u003cspan class=\"keyword\">JOIN\u003c/span> Sales.Orders \u003cspan class=\"keyword\">AS\u003c/span> o \u003cspan class=\"keyword\">ON\u003c/span> o.OrderID = ol.OrderID\n\u003cspan class=\"keyword\">WHERE\u003c/span> o.OrderDate &lt; DATEADD(year,-\u003cspan class=\"number\">7\u003c/span>,SYSDATETIME());\u003c/div>"},{"id":20,"titleFa":"MERGE — همگام‌سازی داده","titleEn":"MERGE — Data Synchronization","tag":"dml","topicsFa":["ساختار WHEN MATCHED و NOT MATCHED","مشکلات همزمانی و رفتارهای غافلگیرکننده","HOLDLOCK و آزمون دقیق","الگوی جایگزین UPDATE سپس INSERT"],"topicsEn":["WHEN MATCHED and NOT MATCHED syntax","concurrency issues and surprising behavior","HOLDLOCK and careful testing","the alternative UPDATE-then-INSERT pattern"],"contentFa":"\n \u003cp>این فصل ساختار WHEN MATCHED و NOT MATCHED را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>ساختار WHEN MATCHED و NOT MATCHED\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>مشکلات همزمانی و رفتارهای غافلگیرکننده\u003c/h3>\n \u003cp>مشکلات همزمانی و رفتارهای غافلگیرکننده زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای مشکلات همزمانی و رفتارهای غافلگیرکننده یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>HOLDLOCK و آزمون دقیق\u003c/h3>\n \u003cp>در بحث HOLDLOCK و آزمون دقیق، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>الگوی جایگزین UPDATE سپس INSERT\u003c/h3>\n \u003cp>الگوی جایگزین UPDATE سپس INSERT حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">BEGIN\u003c/span> \u003cspan class=\"keyword\">TRAN\u003c/span>;\n\u003cspan class=\"keyword\">UPDATE\u003c/span> t \u003cspan class=\"keyword\">WITH\u003c/span> (UPDLOCK, SERIALIZABLE) \u003cspan class=\"keyword\">SET\u003c/span> t.Price = s.Price\n\u003cspan class=\"keyword\">FROM\u003c/span> dbo.TargetProduct t \u003cspan class=\"keyword\">JOIN\u003c/span> #SourceProduct s \u003cspan class=\"keyword\">ON\u003c/span> s.ProductID = t.ProductID;\n\u003cspan class=\"keyword\">INSERT\u003c/span> dbo.TargetProduct(ProductID, Price)\n\u003cspan class=\"keyword\">SELECT\u003c/span> s.ProductID, s.Price \u003cspan class=\"keyword\">FROM\u003c/span> #SourceProduct s\n\u003cspan class=\"keyword\">WHERE\u003c/span> \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">EXISTS\u003c/span> (\u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"number\">1\u003c/span> \u003cspan class=\"keyword\">FROM\u003c/span> dbo.TargetProduct t \u003cspan class=\"keyword\">WHERE\u003c/span> t.ProductID=s.ProductID);\n\u003cspan class=\"keyword\">COMMIT\u003c/span>;\u003c/div>","contentEn":"\n \u003cp>This chapter examines WHEN MATCHED and NOT MATCHED syntax from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>WHEN MATCHED and NOT MATCHED syntax\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>concurrency issues and surprising behavior\u003c/h3>\n \u003cp>concurrency issues and surprising behavior becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for concurrency issues and surprising behavior: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>HOLDLOCK and careful testing\u003c/h3>\n \u003cp>When working with HOLDLOCK and careful testing, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>the alternative UPDATE-then-INSERT pattern\u003c/h3>\n \u003cp>the alternative UPDATE-then-INSERT pattern connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">BEGIN\u003c/span> \u003cspan class=\"keyword\">TRAN\u003c/span>;\n\u003cspan class=\"keyword\">UPDATE\u003c/span> t \u003cspan class=\"keyword\">WITH\u003c/span> (UPDLOCK, SERIALIZABLE) \u003cspan class=\"keyword\">SET\u003c/span> t.Price = s.Price\n\u003cspan class=\"keyword\">FROM\u003c/span> dbo.TargetProduct t \u003cspan class=\"keyword\">JOIN\u003c/span> #SourceProduct s \u003cspan class=\"keyword\">ON\u003c/span> s.ProductID = t.ProductID;\n\u003cspan class=\"keyword\">INSERT\u003c/span> dbo.TargetProduct(ProductID, Price)\n\u003cspan class=\"keyword\">SELECT\u003c/span> s.ProductID, s.Price \u003cspan class=\"keyword\">FROM\u003c/span> #SourceProduct s\n\u003cspan class=\"keyword\">WHERE\u003c/span> \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">EXISTS\u003c/span> (\u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"number\">1\u003c/span> \u003cspan class=\"keyword\">FROM\u003c/span> dbo.TargetProduct t \u003cspan class=\"keyword\">WHERE\u003c/span> t.ProductID=s.ProductID);\n\u003cspan class=\"keyword\">COMMIT\u003c/span>;\u003c/div>"},{"id":21,"titleFa":"CREATE DATABASE و CREATE TABLE","titleEn":"CREATE DATABASE & CREATE TABLE","tag":"ddl","topicsFa":["فایل‌های MDF، NDF و LDF","Filegroup و رشد فایل","Collation و اثر آن بر مقایسه","Computed و Sparse Columns"],"topicsEn":["MDF, NDF, and LDF files","filegroups and file growth","collation and comparison behavior","computed and sparse columns"],"contentFa":"\n \u003cp>این فصل فایل‌های MDF، NDF و LDF را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>فایل‌های MDF، NDF و LDF\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>Filegroup و رشد فایل\u003c/h3>\n \u003cp>Filegroup و رشد فایل زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای Filegroup و رشد فایل یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>Collation و اثر آن بر مقایسه\u003c/h3>\n \u003cp>در بحث Collation و اثر آن بر مقایسه، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>Computed و Sparse Columns\u003c/h3>\n \u003cp>Computed و Sparse Columns حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">DATABASE\u003c/span> SalesDb;\n\u003cspan class=\"keyword\">GO\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> SalesDb.dbo.Product (\n ProductID int IDENTITY \u003cspan class=\"keyword\">CONSTRAINT\u003c/span> PK_Product \u003cspan class=\"keyword\">PRIMARY\u003c/span> \u003cspan class=\"keyword\">KEY\u003c/span>,\n Name nvarchar(\u003cspan class=\"number\">200\u003c/span>) \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>,\n Price decimal(\u003cspan class=\"number\">19\u003c/span>,\u003cspan class=\"number\">4\u003c/span>) \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>,\n PriceWithTax \u003cspan class=\"keyword\">AS\u003c/span> (Price * \u003cspan class=\"number\">1.09\u003c/span>) PERSISTED,\n Notes varchar(max) SPARSE \u003cspan class=\"keyword\">NULL\u003c/span>\n);\u003c/div>","contentEn":"\n \u003cp>This chapter examines MDF, NDF, and LDF files from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>MDF, NDF, and LDF files\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>filegroups and file growth\u003c/h3>\n \u003cp>filegroups and file growth becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for filegroups and file growth: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>collation and comparison behavior\u003c/h3>\n \u003cp>When working with collation and comparison behavior, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>computed and sparse columns\u003c/h3>\n \u003cp>computed and sparse columns connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">DATABASE\u003c/span> SalesDb;\n\u003cspan class=\"keyword\">GO\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> SalesDb.dbo.Product (\n ProductID int IDENTITY \u003cspan class=\"keyword\">CONSTRAINT\u003c/span> PK_Product \u003cspan class=\"keyword\">PRIMARY\u003c/span> \u003cspan class=\"keyword\">KEY\u003c/span>,\n Name nvarchar(\u003cspan class=\"number\">200\u003c/span>) \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>,\n Price decimal(\u003cspan class=\"number\">19\u003c/span>,\u003cspan class=\"number\">4\u003c/span>) \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>,\n PriceWithTax \u003cspan class=\"keyword\">AS\u003c/span> (Price * \u003cspan class=\"number\">1.09\u003c/span>) PERSISTED,\n Notes varchar(max) SPARSE \u003cspan class=\"keyword\">NULL\u003c/span>\n);\u003c/div>"},{"id":22,"titleFa":"انواع داده","titleEn":"Data Types","tag":"ddl","topicsFa":["INT، BIGINT، DECIMAL، MONEY و FLOAT","CHAR، VARCHAR، NCHAR و NVARCHAR","DATE، TIME، DATETIME2 و DATETIMEOFFSET","UNIQUEIDENTIFIER، XML، JSON و GEOGRAPHY"],"topicsEn":["INT, BIGINT, DECIMAL, MONEY, and FLOAT","CHAR, VARCHAR, NCHAR, and NVARCHAR","DATE, TIME, DATETIME2, and DATETIMEOFFSET","UNIQUEIDENTIFIER, XML, JSON, and GEOGRAPHY"],"contentFa":"\n \u003cp>این فصل INT، BIGINT، DECIMAL، MONEY و FLOAT را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>INT، BIGINT، DECIMAL، MONEY و FLOAT\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>CHAR، VARCHAR، NCHAR و NVARCHAR\u003c/h3>\n \u003cp>CHAR، VARCHAR، NCHAR و NVARCHAR زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای CHAR، VARCHAR، NCHAR و NVARCHAR یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>DATE، TIME، DATETIME2 و DATETIMEOFFSET\u003c/h3>\n \u003cp>در بحث DATE، TIME، DATETIME2 و DATETIMEOFFSET، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>UNIQUEIDENTIFIER، XML، JSON و GEOGRAPHY\u003c/h3>\n \u003cp>UNIQUEIDENTIFIER، XML، JSON و GEOGRAPHY حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>نوع\u003c/th>\u003cth>فضای معمول\u003c/th>\u003cth>کاربرد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>int\u003c/td>\u003ctd>4 bytes\u003c/td>\u003ctd>Identifiers/counters\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bigint\u003c/td>\u003ctd>8 bytes\u003c/td>\u003ctd>Very large identifiers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>decimal(p,s)\u003c/td>\u003ctd>5–17 bytes\u003c/td>\u003ctd>Exact finance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>datetime2\u003c/td>\u003ctd>6–8 bytes\u003c/td>\u003ctd>Modern timestamps\u003c/td>\u003c/tr>\u003ctr>\u003ctd>nvarchar(n)\u003c/td>\u003ctd>2 bytes/char\u003c/td>\u003ctd>Unicode text\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> dbo.Measurement (\n MeasurementID bigint IDENTITY \u003cspan class=\"keyword\">PRIMARY\u003c/span> \u003cspan class=\"keyword\">KEY\u003c/span>,\n ExactValue decimal(\u003cspan class=\"number\">19\u003c/span>,\u003cspan class=\"number\">6\u003c/span>) \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>,\n ApproxValue float \u003cspan class=\"keyword\">NULL\u003c/span>,\n OccurredAt datetime2(\u003cspan class=\"number\">3\u003c/span>) \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>,\n SourceId uniqueidentifier \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span> \u003cspan class=\"keyword\">DEFAULT\u003c/span> NEWSEQUENTIALID(),\n Payload nvarchar(max) \u003cspan class=\"keyword\">CHECK\u003c/span> (ISJSON(Payload)=\u003cspan class=\"number\">1\u003c/span>)\n);\u003c/div>","contentEn":"\n \u003cp>This chapter examines INT, BIGINT, DECIMAL, MONEY, and FLOAT from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>INT, BIGINT, DECIMAL, MONEY, and FLOAT\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>CHAR, VARCHAR, NCHAR, and NVARCHAR\u003c/h3>\n \u003cp>CHAR, VARCHAR, NCHAR, and NVARCHAR becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for CHAR, VARCHAR, NCHAR, and NVARCHAR: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>DATE, TIME, DATETIME2, and DATETIMEOFFSET\u003c/h3>\n \u003cp>When working with DATE, TIME, DATETIME2, and DATETIMEOFFSET, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>UNIQUEIDENTIFIER, XML, JSON, and GEOGRAPHY\u003c/h3>\n \u003cp>UNIQUEIDENTIFIER, XML, JSON, and GEOGRAPHY connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Typical storage\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>int\u003c/td>\u003ctd>4 bytes\u003c/td>\u003ctd>Identifiers/counters\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bigint\u003c/td>\u003ctd>8 bytes\u003c/td>\u003ctd>Very large identifiers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>decimal(p,s)\u003c/td>\u003ctd>5–17 bytes\u003c/td>\u003ctd>Exact finance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>datetime2\u003c/td>\u003ctd>6–8 bytes\u003c/td>\u003ctd>Modern timestamps\u003c/td>\u003c/tr>\u003ctr>\u003ctd>nvarchar(n)\u003c/td>\u003ctd>2 bytes/char\u003c/td>\u003ctd>Unicode text\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> dbo.Measurement (\n MeasurementID bigint IDENTITY \u003cspan class=\"keyword\">PRIMARY\u003c/span> \u003cspan class=\"keyword\">KEY\u003c/span>,\n ExactValue decimal(\u003cspan class=\"number\">19\u003c/span>,\u003cspan class=\"number\">6\u003c/span>) \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>,\n ApproxValue float \u003cspan class=\"keyword\">NULL\u003c/span>,\n OccurredAt datetime2(\u003cspan class=\"number\">3\u003c/span>) \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>,\n SourceId uniqueidentifier \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span> \u003cspan class=\"keyword\">DEFAULT\u003c/span> NEWSEQUENTIALID(),\n Payload nvarchar(max) \u003cspan class=\"keyword\">CHECK\u003c/span> (ISJSON(Payload)=\u003cspan class=\"number\">1\u003c/span>)\n);\u003c/div>"},{"id":23,"titleFa":"کلیدها و محدودیت‌ها","titleEn":"Keys & Constraints","tag":"ddl","topicsFa":["PRIMARY KEY، FOREIGN KEY و UNIQUE","CHECK، DEFAULT و NOT NULL","CASCADE و SET NULL","اعتماد Constraint و کیفیت داده"],"topicsEn":["PRIMARY KEY, FOREIGN KEY, and UNIQUE","CHECK, DEFAULT, and NOT NULL","CASCADE and SET NULL","trusted constraints and data quality"],"contentFa":"\n \u003cp>این فصل PRIMARY KEY، FOREIGN KEY و UNIQUE را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>PRIMARY KEY، FOREIGN KEY و UNIQUE\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>CHECK، DEFAULT و NOT NULL\u003c/h3>\n \u003cp>CHECK، DEFAULT و NOT NULL زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای CHECK، DEFAULT و NOT NULL یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>CASCADE و SET NULL\u003c/h3>\n \u003cp>در بحث CASCADE و SET NULL، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>اعتماد Constraint و کیفیت داده\u003c/h3>\n \u003cp>اعتماد Constraint و کیفیت داده حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">ALTER\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> Sales.OrderLine \u003cspan class=\"keyword\">ADD\u003c/span> \u003cspan class=\"keyword\">CONSTRAINT\u003c/span> FK_OrderLine_Order\n\u003cspan class=\"keyword\">FOREIGN\u003c/span> \u003cspan class=\"keyword\">KEY\u003c/span> (OrderID) \u003cspan class=\"keyword\">REFERENCES\u003c/span> Sales.Orders(OrderID) \u003cspan class=\"keyword\">ON\u003c/span> \u003cspan class=\"keyword\">DELETE\u003c/span> CASCADE;\n\u003cspan class=\"keyword\">ALTER\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> Sales.OrderLine \u003cspan class=\"keyword\">ADD\u003c/span> \u003cspan class=\"keyword\">CONSTRAINT\u003c/span> CK_OrderLine_Quantity \u003cspan class=\"keyword\">CHECK\u003c/span> (Quantity &gt; \u003cspan class=\"number\">0\u003c/span>);\u003c/div>","contentEn":"\n \u003cp>This chapter examines PRIMARY KEY, FOREIGN KEY, and UNIQUE from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>PRIMARY KEY, FOREIGN KEY, and UNIQUE\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>CHECK, DEFAULT, and NOT NULL\u003c/h3>\n \u003cp>CHECK, DEFAULT, and NOT NULL becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for CHECK, DEFAULT, and NOT NULL: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>CASCADE and SET NULL\u003c/h3>\n \u003cp>When working with CASCADE and SET NULL, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>trusted constraints and data quality\u003c/h3>\n \u003cp>trusted constraints and data quality connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">ALTER\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> Sales.OrderLine \u003cspan class=\"keyword\">ADD\u003c/span> \u003cspan class=\"keyword\">CONSTRAINT\u003c/span> FK_OrderLine_Order\n\u003cspan class=\"keyword\">FOREIGN\u003c/span> \u003cspan class=\"keyword\">KEY\u003c/span> (OrderID) \u003cspan class=\"keyword\">REFERENCES\u003c/span> Sales.Orders(OrderID) \u003cspan class=\"keyword\">ON\u003c/span> \u003cspan class=\"keyword\">DELETE\u003c/span> CASCADE;\n\u003cspan class=\"keyword\">ALTER\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> Sales.OrderLine \u003cspan class=\"keyword\">ADD\u003c/span> \u003cspan class=\"keyword\">CONSTRAINT\u003c/span> CK_OrderLine_Quantity \u003cspan class=\"keyword\">CHECK\u003c/span> (Quantity &gt; \u003cspan class=\"number\">0\u003c/span>);\u003c/div>"},{"id":24,"titleFa":"نرمال‌سازی","titleEn":"Normalization","tag":"ddl","topicsFa":["فرم اول 1NF و مقادیر اتمی","فرم دوم 2NF و وابستگی جزئی","فرم سوم 3NF و BCNF","Denormalization و مصالحه کارایی"],"topicsEn":["first normal form and atomic values","second normal form and partial dependency","third normal form and BCNF","denormalization and performance trade-offs"],"contentFa":"\n \u003cp>این فصل فرم اول 1NF و مقادیر اتمی را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>فرم اول 1NF و مقادیر اتمی\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>فرم دوم 2NF و وابستگی جزئی\u003c/h3>\n \u003cp>فرم دوم 2NF و وابستگی جزئی زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای فرم دوم 2NF و وابستگی جزئی یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>فرم سوم 3NF و BCNF\u003c/h3>\n \u003cp>در بحث فرم سوم 3NF و BCNF، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>Denormalization و مصالحه کارایی\u003c/h3>\n \u003cp>Denormalization و مصالحه کارایی حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> Sales.OrderHeader (OrderID bigint \u003cspan class=\"keyword\">PRIMARY\u003c/span> \u003cspan class=\"keyword\">KEY\u003c/span>, CustomerID int \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>, OrderDate date \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>);\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> Sales.OrderLine (OrderID bigint \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>, LineNo int \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>, ProductID int \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>, Quantity int \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>,\n \u003cspan class=\"keyword\">CONSTRAINT\u003c/span> PK_OrderLine \u003cspan class=\"keyword\">PRIMARY\u003c/span> \u003cspan class=\"keyword\">KEY\u003c/span>(OrderID, LineNo));\u003c/div>","contentEn":"\n \u003cp>This chapter examines first normal form and atomic values from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>first normal form and atomic values\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>second normal form and partial dependency\u003c/h3>\n \u003cp>second normal form and partial dependency becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for second normal form and partial dependency: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>third normal form and BCNF\u003c/h3>\n \u003cp>When working with third normal form and BCNF, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>denormalization and performance trade-offs\u003c/h3>\n \u003cp>denormalization and performance trade-offs connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> Sales.OrderHeader (OrderID bigint \u003cspan class=\"keyword\">PRIMARY\u003c/span> \u003cspan class=\"keyword\">KEY\u003c/span>, CustomerID int \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>, OrderDate date \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>);\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> Sales.OrderLine (OrderID bigint \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>, LineNo int \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>, ProductID int \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>, Quantity int \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>,\n \u003cspan class=\"keyword\">CONSTRAINT\u003c/span> PK_OrderLine \u003cspan class=\"keyword\">PRIMARY\u003c/span> \u003cspan class=\"keyword\">KEY\u003c/span>(OrderID, LineNo));\u003c/div>"},{"id":25,"titleFa":"ایندکس‌ها","titleEn":"Indexes","tag":"performance","topicsFa":["Clustered در برابر Nonclustered","ایندکس مرکب و ترتیب ستون‌ها","INCLUDE و پوشش کوئری","Filtered Index و نگهداری"],"topicsEn":["clustered versus nonclustered indexes","composite indexes and column order","INCLUDE and query coverage","filtered indexes and maintenance"],"contentFa":"\n \u003cp>این فصل Clustered در برابر Nonclustered را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>Clustered در برابر Nonclustered\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>ایندکس مرکب و ترتیب ستون‌ها\u003c/h3>\n \u003cp>ایندکس مرکب و ترتیب ستون‌ها زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای ایندکس مرکب و ترتیب ستون‌ها یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>INCLUDE و پوشش کوئری\u003c/h3>\n \u003cp>در بحث INCLUDE و پوشش کوئری، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>Filtered Index و نگهداری\u003c/h3>\n \u003cp>Filtered Index و نگهداری حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">INDEX\u003c/span> IX_Orders_Customer_Date\n\u003cspan class=\"keyword\">ON\u003c/span> Sales.Orders(CustomerID, OrderDate DESC)\nINCLUDE (Status, TotalDue)\n\u003cspan class=\"keyword\">WHERE\u003c/span> IsDeleted = \u003cspan class=\"number\">0\u003c/span>;\u003c/div>","contentEn":"\n \u003cp>This chapter examines clustered versus nonclustered indexes from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>clustered versus nonclustered indexes\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and data
