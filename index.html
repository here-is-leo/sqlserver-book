 the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>DP-300 and DP-900 plus the status of legacy certifications\u003c/h3>\n \u003cp>DP-300 and DP-900 plus the status of legacy certifications becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for DP-300 and DP-900 plus the status of legacy certifications: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>Microsoft Learn, SQLskills, and Brent Ozar\u003c/h3>\n \u003cp>When working with Microsoft Learn, SQLskills, and Brent Ozar, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>communities, a capstone project, and a practice plan\u003c/h3>\n \u003cp>communities, a capstone project, and a practice plan connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"comment\">-- Capstone health \u003cspan class=\"keyword\">check\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> DB_NAME(database_id) \u003cspan class=\"keyword\">AS\u003c/span> DatabaseName,\n       SUM(size)*\u003cspan class=\"number\">8\u003c/span>/\u003cspan class=\"number\">1024\u003c/span> \u003cspan class=\"keyword\">AS\u003c/span> SizeMB\n\u003cspan class=\"keyword\">FROM\u003c/span> sys.master_files\n\u003cspan class=\"keyword\">GROUP\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> database_id\n\u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> SizeMB DESC;\u003c/div>"}];
pagesData.push({"id":51,"titleFa":"درباره من — لئو","titleEn":"About the Author — Leo","tag":"author","topicsFa":["توسعه‌دهنده Backend","امنیت سایبری و الکترونیک","آموزش پروژه‌محور","ارتباط با نویسنده"],"topicsEn":["Backend developer","cybersecurity and electronics","project-driven education","contact the author"],"contentFa":"\u003cdiv class=\"author-card\">\u003cdiv class=\"author-avatar\">L\u003c/div>\u003cdiv>\u003ch2>سلام! من لئو (Leo) هستم\u003c/h2>\u003cdiv class=\"author-role\">Backend Developer • Cybersecurity Enthusiast • Technical Author\u003c/div>\u003cp>یک توسعه‌دهنده بک‌اند با بیش از ۴ سال تجربه حرفه‌ای هستم و به امنیت سایبری، الکترونیک، معماری نرم‌افزار و ساخت سامانه‌های قابل اعتماد علاقه دارم. این کتاب با هدف تبدیل مفاهیم SQL Server به دانشی کاربردی، قابل اندازه‌گیری و مناسب پروژه‌های واقعی نوشته شده است.\u003c/p>\u003c/div>\u003c/div>\u003ch3>داستان و نگاه من\u003c/h3>\u003cp>برای من توسعه نرم‌افزار فقط نوشتن کدی که «کار می‌کند» نیست. یک محصول خوب باید امن، قابل نگهداری، قابل مشاهده و آماده رشد باشد. تجربه کار روی Backend به من آموخته است که بخش بزرگی از کیفیت یک سامانه در لایه داده شکل می‌گیرد: انتخاب نوع داده، طراحی Constraint، مرز تراکنش، Index مناسب، مدیریت خطا و شیوه دسترسی برنامه به Database همگی مستقیماً روی تجربه کاربر اثر می‌گذارند.\u003c/p>\u003cp>علاقه‌ام به امنیت سایبری باعث شده همیشه از خودم بپرسم داده چگونه محافظت می‌شود، چه کسی مجاز به دیدن یا تغییر آن است و در صورت خطا چگونه می‌توان مسیر رخداد را بازسازی کرد. علاقه به الکترونیک نیز نگاه سیستماتیک و تجربه‌محور من را تقویت کرده است؛ یعنی مسئله را به اجزای کوچک تقسیم کنیم، اندازه بگیریم، فرضیه بسازیم و با آزمایش کنترل‌شده به نتیجه برسیم.\u003c/p>\u003ch3>چرا این کتاب را نوشتم؟\u003c/h3>\u003cp>هدف من این است که مسیر یادگیری SQL Server از مجموعه‌ای دستور پراکنده به یک نقشه راه حرفه‌ای تبدیل شود. می‌خواهم خواننده پس از پایان کتاب بتواند یک Database را طراحی کند، کوئری قابل اعتماد بنویسد، Execution Plan را تحلیل کند، از داده محافظت کند و درباره مصالحه‌های فنی تصمیمی مستند بگیرد. مثال‌ها عمداً پروژه‌محور هستند تا فاصله آموزش با محیط واقعی کمتر شود.\u003c/p>\u003cdiv class=\"author-values\">\u003cdiv class=\"author-value\">\u003cstrong>مهندسی دقیق\u003c/strong>\u003cspan>تصمیم بر پایه داده، تست و اندازه‌گیری؛ نه حدس.\u003c/span>\u003c/div>\u003cdiv class=\"author-value\">\u003cstrong>امنیت از ابتدا\u003c/strong>\u003cspan>Least Privilege، ورودی امن و طراحی دفاعی.\u003c/span>\u003c/div>\u003cdiv class=\"author-value\">\u003cstrong>یادگیری مداوم\u003c/strong>\u003cspan>ساختن، شکست امن، بازبینی و انتقال تجربه.\u003c/span>\u003c/div>\u003c/div>\u003ch3>راه‌های ارتباط با من\u003c/h3>\u003cdiv class=\"contact-grid\">\u003ca class=\"contact-link\" href=\"https://github.com/here-is-leo\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cstrong>◆ GitHub\u003c/strong>\u003cspan>github.com/here-is-leo\u003c/span>\u003c/a>\u003ca class=\"contact-link\" href=\"https://t.me/Here_is_leo\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cstrong>◆ Telegram\u003c/strong>\u003cspan>t.me/Here_is_leo\u003c/span>\u003c/a>\u003ca class=\"contact-link\" href=\"https://here-is-leo.ir\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cstrong>◆ Website\u003c/strong>\u003cspan>here-is-leo.ir\u003c/span>\u003c/a>\u003ca class=\"contact-link\" href=\"mailto:ilyafarahanii@gmail.com\">\u003cstrong>◆ Email\u003c/strong>\u003cspan>ilyafarahanii@gmail.com\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"info-box success\">\u003cstrong>پیام پایانی\u003c/strong>\u003cp>اگر این کتاب باعث شد یک کوئری را بهتر بفهمید، یک آسیب‌پذیری را پیش از انتشار پیدا کنید یا Database مطمئن‌تری بسازید، به هدف خود رسیده‌ام. آموخته‌هایتان را با دیگران به اشتراک بگذارید و همیشه روی محیطی کار کنید که برای آن مجوز دارید.\u003c/p>\u003c/div>\u003cp class=\"signature\">با احترام و آرزوی موفقیت — لئو\u003c/p>","contentEn":"\u003cdiv class=\"author-card\">\u003cdiv class=\"author-avatar\">L\u003c/div>\u003cdiv>\u003ch2>Hello! I’m Leo\u003c/h2>\u003cdiv class=\"author-role\">Backend Developer • Cybersecurity Enthusiast • Technical Author\u003c/div>\u003cp>I am a backend developer with more than four years of professional experience and a strong interest in cybersecurity, electronics, software architecture, and dependable systems. I created this book to turn SQL Server concepts into practical, measurable knowledge for real projects.\u003c/p>\u003c/div>\u003c/div>\u003ch3>My perspective\u003c/h3>\u003cp>To me, software development is more than writing code that merely works. A good product must be secure, maintainable, observable, and ready to grow. Backend work has taught me that much of a system’s quality is decided in the data layer: data types, constraints, transaction boundaries, indexes, error handling, and the way an application accesses its database all shape the user experience.\u003c/p>\u003cp>My interest in cybersecurity keeps me asking how data is protected, who may read or change it, and how an incident can be reconstructed. Electronics has strengthened the same systems mindset: break a problem into components, measure behavior, form a hypothesis, and verify it through controlled experiments.\u003c/p>\u003ch3>Why I wrote this book\u003c/h3>\u003cp>My goal is to turn SQL Server learning from a collection of disconnected commands into a professional roadmap. By the end, readers should be able to design a database, write dependable queries, interpret execution plans, protect data, and document technical trade-offs. The examples are deliberately project-driven so that learning stays close to real engineering work.\u003c/p>\u003cdiv class=\"author-values\">\u003cdiv class=\"author-value\">\u003cstrong>Engineering rigor\u003c/strong>\u003cspan>Decisions based on evidence, tests, and measurement.\u003c/span>\u003c/div>\u003cdiv class=\"author-value\">\u003cstrong>Security by design\u003c/strong>\u003cspan>Least privilege, safe input, and defensive architecture.\u003c/span>\u003c/div>\u003cdiv class=\"author-value\">\u003cstrong>Continuous learning\u003c/strong>\u003cspan>Build, fail safely, review, and share experience.\u003c/span>\u003c/div>\u003c/div>\u003ch3>Connect with me\u003c/h3>\u003cdiv class=\"contact-grid\">\u003ca class=\"contact-link\" href=\"https://github.com/here-is-leo\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cstrong>◆ GitHub\u003c/strong>\u003cspan>github.com/here-is-leo\u003c/span>\u003c/a>\u003ca class=\"contact-link\" href=\"https://t.me/Here_is_leo\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cstrong>◆ Telegram\u003c/strong>\u003cspan>t.me/Here_is_leo\u003c/span>\u003c/a>\u003ca class=\"contact-link\" href=\"https://here-is-leo.ir\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cstrong>◆ Website\u003c/strong>\u003cspan>here-is-leo.ir\u003c/span>\u003c/a>\u003ca class=\"contact-link\" href=\"mailto:ilyafarahanii@gmail.com\">\u003cstrong>◆ Email\u003c/strong>\u003cspan>ilyafarahanii@gmail.com\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"info-box success\">\u003cstrong>Final note\u003c/strong>\u003cp>If this book helps you understand one query more deeply, catch one vulnerability before release, or build one more dependable database, it has fulfilled its purpose. Share what you learn, and always work only on systems you are authorized to use.\u003c/p>\u003c/div>\u003cp class=\"signature\">With respect and best wishes — Leo\u003c/p>"});
