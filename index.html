<script>
const pagesData=[{"id":1,"titleFa":"پیش‌گفتار — چرا SQL Server؟","titleEn":"Foreword — Why SQL Server?","tag":"start","topicsFa":["تاریخچه ۱۹۸۹ تا SQL Server 2022 و Azure SQL","جایگاه در بازار و مقایسه با Oracle، MySQL و PostgreSQL","مسیرهای شغلی DBA، Developer، BI Developer و Data Engineer","استفاده قانونی، اخلاقی و مسئولانه"],"topicsEn":["history from 1989 through SQL Server 2022 and Azure SQL","market position versus Oracle, MySQL, and PostgreSQL","career paths for DBAs, developers, BI developers, and data engineers","legal, ethical, and responsible use"],"contentFa":"\u003cdiv class=\"info-box standard\">\u003cstrong>یادداشت حقوقی و اخلاقی\u003c/strong>\u003cp>فقط روی سامانه‌ای کار کنید که مالک آن هستید یا مجوز کتبی دارید. نمونه‌های امنیتی برای دفاع، آموزش و آزمون کنترل‌شده‌اند.\u003c/p>\u003c/div>\u003cp>SQL Server نخستین بار در سال 1989 با همکاری Microsoft، Sybase و Ashton-Tate عرضه شد و در مسیر نسخه‌های Windows NT، 2000، 2005، 2012، 2016، 2019 و 2022 به یک سکوی کامل داده تبدیل شد. Azure SQL همان خانواده فناوری را با مدیریت ابری عرضه می‌کند. آمار بازار با روش نمونه‌گیری منابع مختلف تغییر می‌کند؛ بنابراین به‌جای یک درصد ثابت، روند تقاضای سازمانی، اکوسیستم Microsoft و نیاز صنایع را بسنجید.\u003c/p>\n \u003cp>این فصل تاریخچه ۱۹۸۹ تا SQL Server 2022 و Azure SQL را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>تاریخچه ۱۹۸۹ تا SQL Server 2022 و Azure SQL\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>جایگاه در بازار و مقایسه با Oracle، MySQL و PostgreSQL\u003c/h3>\n \u003cp>جایگاه در بازار و مقایسه با Oracle، MySQL و PostgreSQL زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای جایگاه در بازار و مقایسه با Oracle، MySQL و PostgreSQL یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>مسیرهای شغلی DBA، Developer، BI Developer و Data Engineer\u003c/h3>\n \u003cp>در بحث مسیرهای شغلی DBA، Developer، BI Developer و Data Engineer، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>استفاده قانونی، اخلاقی و مسئولانه\u003c/h3>\n \u003cp>استفاده قانونی، اخلاقی و مسئولانه حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> @@VERSION \u003cspan class=\"keyword\">AS\u003c/span> SqlServerVersion;\u003c/div>","contentEn":"\u003cdiv class=\"info-box standard\">\u003cstrong>Legal and ethical note\u003c/strong>\u003cp>Work only on systems you own or are explicitly authorized to test. Security examples are for defense, education, and controlled laboratories.\u003c/p>\u003c/div>\u003cp>SQL Server first appeared in 1989 through a Microsoft, Sybase, and Ashton-Tate collaboration. Across the Windows NT, 2000, 2005, 2012, 2016, 2019, and 2022 generations it became a broad data platform; Azure SQL carries much of that technology into managed cloud services. Market-share percentages vary by survey method, so evaluate enterprise demand, the Microsoft ecosystem, and industry needs instead of repeating one timeless number.\u003c/p>\n \u003cp>This chapter examines history from 1989 through SQL Server 2022 and Azure SQL from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>history from 1989 through SQL Server 2022 and Azure SQL\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>market position versus Oracle, MySQL, and PostgreSQL\u003c/h3>\n \u003cp>market position versus Oracle, MySQL, and PostgreSQL becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for market position versus Oracle, MySQL, and PostgreSQL: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>career paths for DBAs, developers, BI developers, and data engineers\u003c/h3>\n \u003cp>When working with career paths for DBAs, developers, BI developers, and data engineers, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>legal, ethical, and responsible use\u003c/h3>\n \u003cp>legal, ethical, and responsible use connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> @@VERSION \u003cspan class=\"keyword\">AS\u003c/span> SqlServerVersion;\u003c/div>"},{"id":2,"titleFa":"تاریخچه و نسخه‌های SQL Server","titleEn":"History & Versions","tag":"fundamentals","topicsFa":["نسخه‌های 2000 تا 2022 و نقاط عطف","Express، Standard، Enterprise و Developer","انتخاب نسخه بر اساس بارکاری و مجوز","سازگاری، ارتقا و Compatibility Level"],"topicsEn":["versions from 2000 to 2022 and their milestones","Express, Standard, Enterprise, and Developer editions","edition choice by workload and licensing","compatibility, upgrades, and compatibility level"],"contentFa":"\n \u003cp>این فصل نسخه‌های 2000 تا 2022 و نقاط عطف را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>نسخه‌های 2000 تا 2022 و نقاط عطف\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>Express، Standard، Enterprise و Developer\u003c/h3>\n \u003cp>Express، Standard، Enterprise و Developer زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای Express، Standard، Enterprise و Developer یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>انتخاب نسخه بر اساس بارکاری و مجوز\u003c/h3>\n \u003cp>در بحث انتخاب نسخه بر اساس بارکاری و مجوز، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>سازگاری، ارتقا و Compatibility Level\u003c/h3>\n \u003cp>سازگاری، ارتقا و Compatibility Level حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>نسخه\u003c/th>\u003cth>کاربرد مناسب\u003c/th>\u003cth>نکته اصلی\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Express\u003c/td>\u003ctd>Learning / small apps\u003c/td>\u003ctd>Free, resource limits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Standard\u003c/td>\u003ctd>Business workloads\u003c/td>\u003ctd>Core HA and BI\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enterprise\u003c/td>\u003ctd>Mission critical\u003c/td>\u003ctd>Full scale and advanced features\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Developer\u003c/td>\u003ctd>Development only\u003c/td>\u003ctd>Enterprise features, non-production\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> SERVERPROPERTY(\u003cspan class=\"string\">'Edition'\u003c/span>) \u003cspan class=\"keyword\">AS\u003c/span> Edition,\n       SERVERPROPERTY(\u003cspan class=\"string\">'ProductVersion'\u003c/span>) \u003cspan class=\"keyword\">AS\u003c/span> Version,\n       compatibility_level\n\u003cspan class=\"keyword\">FROM\u003c/span> sys.databases\n\u003cspan class=\"keyword\">WHERE\u003c/span> name = DB_NAME();\u003c/div>","contentEn":"\n \u003cp>This chapter examines versions from 2000 to 2022 and their milestones from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>versions from 2000 to 2022 and their milestones\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>Express, Standard, Enterprise, and Developer editions\u003c/h3>\n \u003cp>Express, Standard, Enterprise, and Developer editions becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for Express, Standard, Enterprise, and Developer editions: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>edition choice by workload and licensing\u003c/h3>\n \u003cp>When working with edition choice by workload and licensing, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>compatibility, upgrades, and compatibility level\u003c/h3>\n \u003cp>compatibility, upgrades, and compatibility level connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Edition\u003c/th>\u003cth>Best fit\u003c/th>\u003cth>Core note\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Express\u003c/td>\u003ctd>Learning / small apps\u003c/td>\u003ctd>Free, resource limits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Standard\u003c/td>\u003ctd>Business workloads\u003c/td>\u003ctd>Core HA and BI\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enterprise\u003c/td>\u003ctd>Mission critical\u003c/td>\u003ctd>Full scale and advanced features\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Developer\u003c/td>\u003ctd>Development only\u003c/td>\u003ctd>Enterprise features, non-production\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> SERVERPROPERTY(\u003cspan class=\"string\">'Edition'\u003c/span>) \u003cspan class=\"keyword\">AS\u003c/span> Edition,\n       SERVERPROPERTY(\u003cspan class=\"string\">'ProductVersion'\u003c/span>) \u003cspan class=\"keyword\">AS\u003c/span> Version,\n       compatibility_level\n\u003cspan class=\"keyword\">FROM\u003c/span> sys.databases\n\u003cspan class=\"keyword\">WHERE\u003c/span> name = DB_NAME();\u003c/div>"},{"id":3,"titleFa":"معماری SQL Server","titleEn":"SQL Server Architecture","tag":"fundamentals","topicsFa":["Relational Engine و Storage Engine","Buffer Pool و Plan Cache","Transaction Log و فرایند Recovery","صفحات، Extentها و فایل‌های داده"],"topicsEn":["the relational engine and storage engine","the buffer pool and plan cache","the transaction log and recovery process","pages, extents, and data files"],"contentFa":"\u003cdiv class=\"architecture\">\u003cdiv>Client / TDS\u003c/div>\u003cspan>↓\u003c/span>\u003cdiv>Relational Engine: Parser → Algebrizer → Optimizer → Executor\u003c/div>\u003cspan>↓\u003c/span>\u003cdiv>Storage Engine: Access Methods → Buffer Pool → Data Files\u003c/div>\u003cspan>↔\u003c/span>\u003cdiv>Transaction Log / Recovery\u003c/div>\u003c/div>\n \u003cp>این فصل Relational Engine و Storage Engine را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>Relational Engine و Storage Engine\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>Buffer Pool و Plan Cache\u003c/h3>\n \u003cp>Buffer Pool و Plan Cache زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای Buffer Pool و Plan Cache یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>Transaction Log و فرایند Recovery\u003c/h3>\n \u003cp>در بحث Transaction Log و فرایند Recovery، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>صفحات، Extentها و فایل‌های داده\u003c/h3>\n \u003cp>صفحات، Extentها و فایل‌های داده حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"keyword\">type\u003c/span>, pages_kb, virtual_memory_committed_kb\n\u003cspan class=\"keyword\">FROM\u003c/span> sys.dm_os_memory_clerks\n\u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> pages_kb DESC;\u003c/div>","contentEn":"\u003cdiv class=\"architecture\">\u003cdiv>Client / TDS\u003c/div>\u003cspan>↓\u003c/span>\u003cdiv>Relational Engine: Parser → Algebrizer → Optimizer → Executor\u003c/div>\u003cspan>↓\u003c/span>\u003cdiv>Storage Engine: Access Methods → Buffer Pool → Data Files\u003c/div>\u003cspan>↔\u003c/span>\u003cdiv>Transaction Log / Recovery\u003c/div>\u003c/div>\n \u003cp>This chapter examines the relational engine and storage engine from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>the relational engine and storage engine\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>the buffer pool and plan cache\u003c/h3>\n \u003cp>the buffer pool and plan cache becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for the buffer pool and plan cache: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>the transaction log and recovery process\u003c/h3>\n \u003cp>When working with the transaction log and recovery process, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>pages, extents, and data files\u003c/h3>\n \u003cp>pages, extents, and data files connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"keyword\">type\u003c/span>, pages_kb, virtual_memory_committed_kb\n\u003cspan class=\"keyword\">FROM\u003c/span> sys.dm_os_memory_clerks\n\u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> pages_kb DESC;\u003c/div>"},{"id":4,"titleFa":"نصب و راه‌اندازی","titleEn":"Installation & Setup","tag":"start","topicsFa":["نیازمندی‌های سیستم و حساب سرویس","نصب Database Engine و SSMS","Azure Data Studio، Docker و sqlcmd","تنظیمات پس از نصب و اتصال امن"],"topicsEn":["system requirements and service accounts","installing Database Engine and SSMS","Azure Data Studio, Docker, and sqlcmd","post-install configuration and secure connections"],"contentFa":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>مولفه\u003c/th>\u003cth>حداقل آموزشی\u003c/th>\u003cth>پیشنهاد عملی\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CPU\u003c/td>\u003ctd>x64، دو هسته\u003c/td>\u003ctd>چهار هسته یا بیشتر\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAM\u003c/td>\u003ctd>۴ GB\u003c/td>\u003ctd>۸ تا ۱۶ GB برای Lab\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage\u003c/td>\u003ctd>۱۰ GB آزاد\u003c/td>\u003ctd>SSD با فضای جدا برای Data و Log\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n \u003cp>این فصل نیازمندی‌های سیستم و حساب سرویس را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>نیازمندی‌های سیستم و حساب سرویس\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>نصب Database Engine و SSMS\u003c/h3>\n \u003cp>نصب Database Engine و SSMS زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای نصب Database Engine و SSMS یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>Azure Data Studio، Docker و sqlcmd\u003c/h3>\n \u003cp>در بحث Azure Data Studio، Docker و sqlcmd، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>تنظیمات پس از نصب و اتصال امن\u003c/h3>\n \u003cp>تنظیمات پس از نصب و اتصال امن حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\ndocker run -e \"ACCEPT_EULA=Y\" -e \"MSSQL_SA_PASSWORD=Strong!Passw0rd\" \\\n  -p \u003cspan class=\"number\">1433\u003c/span>:\u003cspan class=\"number\">1433\u003c/span> \u003cspan class=\"comment\">--name sql2022 -d mcr.microsoft.com/mssql/server:\u003cspan class=\"number\">2022\u003c/span>-latest\u003c/span>\n\nsqlcmd -S localhost -U sa -P \"Strong!Passw0rd\" -Q \"\u003cspan class=\"keyword\">SELECT\u003c/span> @@VERSION\"\u003c/div>","contentEn":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Learning minimum\u003c/th>\u003cth>Practical recommendation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CPU\u003c/td>\u003ctd>x64, two cores\u003c/td>\u003ctd>Four or more cores\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAM\u003c/td>\u003ctd>4 GB\u003c/td>\u003ctd>8–16 GB for a lab\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage\u003c/td>\u003ctd>10 GB free\u003c/td>\u003ctd>SSD, separate data/log paths\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n \u003cp>This chapter examines system requirements and service accounts from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>system requirements and service accounts\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>installing Database Engine and SSMS\u003c/h3>\n \u003cp>installing Database Engine and SSMS becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for installing Database Engine and SSMS: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>Azure Data Studio, Docker, and sqlcmd\u003c/h3>\n \u003cp>When working with Azure Data Studio, Docker, and sqlcmd, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>post-install configuration and secure connections\u003c/h3>\n \u003cp>post-install configuration and secure connections connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\ndocker run -e \"ACCEPT_EULA=Y\" -e \"MSSQL_SA_PASSWORD=Strong!Passw0rd\" \\\n  -p \u003cspan class=\"number\">1433\u003c/span>:\u003cspan class=\"number\">1433\u003c/span> \u003cspan class=\"comment\">--name sql2022 -d mcr.microsoft.com/mssql/server:\u003cspan class=\"number\">2022\u003c/span>-latest\u003c/span>\n\nsqlcmd -S localhost -U sa -P \"Strong!Passw0rd\" -Q \"\u003cspan class=\"keyword\">SELECT\u003c/span> @@VERSION\"\u003c/div>"},{"id":5,"titleFa":"اولین کوئری: SELECT","titleEn":"Your First Query: SELECT","tag":"select","topicsFa":["ساختار SELECT و انتخاب ستون‌ها","Alias، DISTINCT و محاسبات","TOP در برابر OFFSET-FETCH","ترتیب منطقی پردازش کوئری"],"topicsEn":["SELECT structure and column projection","aliases, DISTINCT, and expressions","TOP versus OFFSET-FETCH","logical query processing order"],"contentFa":"\n \u003cp>این فصل ساختار SELECT و انتخاب ستون‌ها را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>ساختار SELECT و انتخاب ستون‌ها\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>Alias، DISTINCT و محاسبات\u003c/h3>\n \u003cp>Alias، DISTINCT و محاسبات زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای Alias، DISTINCT و محاسبات یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>TOP در برابر OFFSET-FETCH\u003c/h3>\n \u003cp>در بحث TOP در برابر OFFSET-FETCH، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>ترتیب منطقی پردازش کوئری\u003c/h3>\n \u003cp>ترتیب منطقی پردازش کوئری حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"keyword\">TOP\u003c/span> (\u003cspan class=\"number\">10\u003c/span>)\n       ProductID,\n       Name \u003cspan class=\"keyword\">AS\u003c/span> ProductName,\n       ListPrice,\n       ListPrice * \u003cspan class=\"number\">0.9\u003c/span> \u003cspan class=\"keyword\">AS\u003c/span> DiscountPrice\n\u003cspan class=\"keyword\">FROM\u003c/span> Production.Product\n\u003cspan class=\"keyword\">WHERE\u003c/span> ListPrice &gt; \u003cspan class=\"number\">0\u003c/span>\n\u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> ListPrice DESC;\u003c/div>","contentEn":"\n \u003cp>This chapter examines SELECT structure and column projection from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>SELECT structure and column projection\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>aliases, DISTINCT, and expressions\u003c/h3>\n \u003cp>aliases, DISTINCT, and expressions becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for aliases, DISTINCT, and expressions: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>TOP versus OFFSET-FETCH\u003c/h3>\n \u003cp>When working with TOP versus OFFSET-FETCH, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>logical query processing order\u003c/h3>\n \u003cp>logical query processing order connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"keyword\">TOP\u003c/span> (\u003cspan class=\"number\">10\u003c/span>)\n       ProductID,\n       Name \u003cspan class=\"keyword\">AS\u003c/span> ProductName,\n       ListPrice,\n       ListPrice * \u003cspan class=\"number\">0.9\u003c/span> \u003cspan class=\"keyword\">AS\u003c/span> DiscountPrice\n\u003cspan class=\"keyword\">FROM\u003c/span> Production.Product\n\u003cspan class=\"keyword\">WHERE\u003c/span> ListPrice &gt; \u003cspan class=\"number\">0\u003c/span>\n\u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> ListPrice DESC;\u003c/div>"},{"id":6,"titleFa":"فیلتر کردن داده‌ها: WHERE","titleEn":"Filtering Data: WHERE","tag":"select","topicsFa":["عملگرهای مقایسه و منطق سه‌ارزشی","AND، OR، NOT، IN و BETWEEN","LIKE و wildcardهای درصد، زیرخط و براکت","IS NULL، ISNULL و COALESCE"],"topicsEn":["comparison operators and three-valued logic","AND, OR, NOT, IN, and BETWEEN","LIKE and percent, underscore, and bracket wildcards","IS NULL, ISNULL, and COALESCE"],"contentFa":"\n \u003cp>این فصل عملگرهای مقایسه و منطق سه‌ارزشی را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>عملگرهای مقایسه و منطق سه‌ارزشی\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>AND، OR، NOT، IN و BETWEEN\u003c/h3>\n \u003cp>AND، OR، NOT، IN و BETWEEN زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای AND، OR، NOT، IN و BETWEEN یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>LIKE و wildcardهای درصد، زیرخط و براکت\u003c/h3>\n \u003cp>در بحث LIKE و wildcardهای درصد، زیرخط و براکت، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>IS NULL، ISNULL و COALESCE\u003c/h3>\n \u003cp>IS NULL، ISNULL و COALESCE حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> CustomerID, EmailAddress\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Customer\n\u003cspan class=\"keyword\">WHERE\u003c/span> (City \u003cspan class=\"keyword\">IN\u003c/span> (N\u003cspan class=\"string\">'Tehran'\u003c/span>, N\u003cspan class=\"string\">'Shiraz'\u003c/span>) \u003cspan class=\"keyword\">OR\u003c/span> CreditLimit \u003cspan class=\"keyword\">BETWEEN\u003c/span> \u003cspan class=\"number\">1000\u003c/span> \u003cspan class=\"keyword\">AND\u003c/span> \u003cspan class=\"number\">5000\u003c/span>)\n  \u003cspan class=\"keyword\">AND\u003c/span> EmailAddress \u003cspan class=\"keyword\">LIKE\u003c/span> N\u003cspan class=\"string\">'%@%'\u003c/span>\n  \u003cspan class=\"keyword\">AND\u003c/span> DeletedAt \u003cspan class=\"keyword\">IS\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>;\u003c/div>","contentEn":"\n \u003cp>This chapter examines comparison operators and three-valued logic from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>comparison operators and three-valued logic\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>AND, OR, NOT, IN, and BETWEEN\u003c/h3>\n \u003cp>AND, OR, NOT, IN, and BETWEEN becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for AND, OR, NOT, IN, and BETWEEN: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>LIKE and percent, underscore, and bracket wildcards\u003c/h3>\n \u003cp>When working with LIKE and percent, underscore, and bracket wildcards, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>IS NULL, ISNULL, and COALESCE\u003c/h3>\n \u003cp>IS NULL, ISNULL, and COALESCE connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> CustomerID, EmailAddress\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Customer\n\u003cspan class=\"keyword\">WHERE\u003c/span> (City \u003cspan class=\"keyword\">IN\u003c/span> (N\u003cspan class=\"string\">'Tehran'\u003c/span>, N\u003cspan class=\"string\">'Shiraz'\u003c/span>) \u003cspan class=\"keyword\">OR\u003c/span> CreditLimit \u003cspan class=\"keyword\">BETWEEN\u003c/span> \u003cspan class=\"number\">1000\u003c/span> \u003cspan class=\"keyword\">AND\u003c/span> \u003cspan class=\"number\">5000\u003c/span>)\n  \u003cspan class=\"keyword\">AND\u003c/span> EmailAddress \u003cspan class=\"keyword\">LIKE\u003c/span> N\u003cspan class=\"string\">'%@%'\u003c/span>\n  \u003cspan class=\"keyword\">AND\u003c/span> DeletedAt \u003cspan class=\"keyword\">IS\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>;\u003c/div>"},{"id":7,"titleFa":"مرتب‌سازی و گروه‌بندی","titleEn":"Sorting & Grouping","tag":"select","topicsFa":["ORDER BY چندستونی و عبارت‌ها","GROUP BY و HAVING","ROLLUP و CUBE","GROUPING SETS و گزارش‌های چندسطحی"],"topicsEn":["multi-column ORDER BY and expressions","GROUP BY and HAVING","ROLLUP and CUBE","GROUPING SETS and multi-level reports"],"contentFa":"\n \u003cp>این فصل ORDER BY چندستونی و عبارت‌ها را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n
