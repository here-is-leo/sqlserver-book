03cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">WITH\u003c/span> Org \u003cspan class=\"keyword\">AS\u003c/span> (\n  \u003cspan class=\"keyword\">SELECT\u003c/span> EmployeeID, ManagerID, Name, \u003cspan class=\"number\">0\u003c/span> \u003cspan class=\"keyword\">AS\u003c/span> Depth, CAST(Name \u003cspan class=\"keyword\">AS\u003c/span> nvarchar(max)) \u003cspan class=\"keyword\">AS\u003c/span> Path\n  \u003cspan class=\"keyword\">FROM\u003c/span> HR.Employee \u003cspan class=\"keyword\">WHERE\u003c/span> ManagerID \u003cspan class=\"keyword\">IS\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>\n  \u003cspan class=\"keyword\">UNION\u003c/span> \u003cspan class=\"keyword\">ALL\u003c/span>\n  \u003cspan class=\"keyword\">SELECT\u003c/span> e.EmployeeID, e.ManagerID, e.Name, o.Depth + \u003cspan class=\"number\">1\u003c/span>, CONCAT(o.Path, N\u003cspan class=\"string\">' &gt; '\u003c/span>, e.Name)\n  \u003cspan class=\"keyword\">FROM\u003c/span> HR.Employee e \u003cspan class=\"keyword\">JOIN\u003c/span> Org o \u003cspan class=\"keyword\">ON\u003c/span> e.ManagerID = o.EmployeeID\n)\n\u003cspan class=\"keyword\">SELECT\u003c/span> * \u003cspan class=\"keyword\">FROM\u003c/span> Org \u003cspan class=\"keyword\">OPTION\u003c/span> (MAXRECURSION \u003cspan class=\"number\">100\u003c/span>);\u003c/div>","contentEn":"\n \u003cp>This chapter examines employee-manager relationships from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>employee-manager relationships\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>self-joins for fixed levels\u003c/h3>\n \u003cp>self-joins for fixed levels becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for self-joins for fixed levels: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>recursive CTEs for organization trees\u003c/h3>\n \u003cp>When working with recursive CTEs for organization trees, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>paths, depth, and cycle prevention\u003c/h3>\n \u003cp>paths, depth, and cycle prevention connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">WITH\u003c/span> Org \u003cspan class=\"keyword\">AS\u003c/span> (\n  \u003cspan class=\"keyword\">SELECT\u003c/span> EmployeeID, ManagerID, Name, \u003cspan class=\"number\">0\u003c/span> \u003cspan class=\"keyword\">AS\u003c/span> Depth, CAST(Name \u003cspan class=\"keyword\">AS\u003c/span> nvarchar(max)) \u003cspan class=\"keyword\">AS\u003c/span> Path\n  \u003cspan class=\"keyword\">FROM\u003c/span> HR.Employee \u003cspan class=\"keyword\">WHERE\u003c/span> ManagerID \u003cspan class=\"keyword\">IS\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>\n  \u003cspan class=\"keyword\">UNION\u003c/span> \u003cspan class=\"keyword\">ALL\u003c/span>\n  \u003cspan class=\"keyword\">SELECT\u003c/span> e.EmployeeID, e.ManagerID, e.Name, o.Depth + \u003cspan class=\"number\">1\u003c/span>, CONCAT(o.Path, N\u003cspan class=\"string\">' &gt; '\u003c/span>, e.Name)\n  \u003cspan class=\"keyword\">FROM\u003c/span> HR.Employee e \u003cspan class=\"keyword\">JOIN\u003c/span> Org o \u003cspan class=\"keyword\">ON\u003c/span> e.ManagerID = o.EmployeeID\n)\n\u003cspan class=\"keyword\">SELECT\u003c/span> * \u003cspan class=\"keyword\">FROM\u003c/span> Org \u003cspan class=\"keyword\">OPTION\u003c/span> (MAXRECURSION \u003cspan class=\"number\">100\u003c/span>);\u003c/div>"},{"id":14,"titleFa":"زیرکوئری‌ها","titleEn":"Subqueries","tag":"cte","topicsFa":["زیرکوئری Scalar و چندردیفی","Correlated در برابر non-correlated","EXISTS در برابر IN و JOIN","زیرکوئری در SELECT، FROM و WHERE"],"topicsEn":["scalar and multi-row subqueries","correlated versus non-correlated forms","EXISTS versus IN and JOIN","subqueries in SELECT, FROM, and WHERE"],"contentFa":"\n \u003cp>این فصل زیرکوئری Scalar و چندردیفی را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>زیرکوئری Scalar و چندردیفی\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>Correlated در برابر non-correlated\u003c/h3>\n \u003cp>Correlated در برابر non-correlated زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای Correlated در برابر non-correlated یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>EXISTS در برابر IN و JOIN\u003c/h3>\n \u003cp>در بحث EXISTS در برابر IN و JOIN، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>زیرکوئری در SELECT، FROM و WHERE\u003c/h3>\n \u003cp>زیرکوئری در SELECT، FROM و WHERE حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> p.ProductID, p.Name\n\u003cspan class=\"keyword\">FROM\u003c/span> Production.Product \u003cspan class=\"keyword\">AS\u003c/span> p\n\u003cspan class=\"keyword\">WHERE\u003c/span> \u003cspan class=\"keyword\">EXISTS\u003c/span> (\n  \u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"number\">1\u003c/span> \u003cspan class=\"keyword\">FROM\u003c/span> Sales.OrderLine \u003cspan class=\"keyword\">AS\u003c/span> ol\n  \u003cspan class=\"keyword\">WHERE\u003c/span> ol.ProductID = p.ProductID \u003cspan class=\"keyword\">AND\u003c/span> ol.Quantity &gt;= \u003cspan class=\"number\">10\u003c/span>\n);\u003c/div>","contentEn":"\n \u003cp>This chapter examines scalar and multi-row subqueries from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>scalar and multi-row subqueries\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>correlated versus non-correlated forms\u003c/h3>\n \u003cp>correlated versus non-correlated forms becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for correlated versus non-correlated forms: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>EXISTS versus IN and JOIN\u003c/h3>\n \u003cp>When working with EXISTS versus IN and JOIN, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>subqueries in SELECT, FROM, and WHERE\u003c/h3>\n \u003cp>subqueries in SELECT, FROM, and WHERE connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> p.ProductID, p.Name\n\u003cspan class=\"keyword\">FROM\u003c/span> Production.Product \u003cspan class=\"keyword\">AS\u003c/span> p\n\u003cspan class=\"keyword\">WHERE\u003c/span> \u003cspan class=\"keyword\">EXISTS\u003c/span> (\n  \u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"number\">1\u003c/span> \u003cspan class=\"keyword\">FROM\u003c/span> Sales.OrderLine \u003cspan class=\"keyword\">AS\u003c/span> ol\n  \u003cspan class=\"keyword\">WHERE\u003c/span> ol.ProductID = p.ProductID \u003cspan class=\"keyword\">AND\u003c/span> ol.Quantity &gt;= \u003cspan class=\"number\">10\u003c/span>\n);\u003c/div>"},{"id":15,"titleFa":"CTE — Common Table Expressions","titleEn":"Common Table Expressions","tag":"cte","topicsFa":["ساختار WITH و خوانایی","چند CTE در یک Statement","Recursive CTE و MAXRECURSION","مقایسه CTE، temp table و derived table"],"topicsEn":["WITH syntax and readability","multiple CTEs in one statement","recursive CTEs and MAXRECURSION","CTEs versus temp tables and derived tables"],"contentFa":"\n \u003cp>این فصل ساختار WITH و خوانایی را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>ساختار WITH و خوانایی\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>چند CTE در یک Statement\u003c/h3>\n \u003cp>چند CTE در یک Statement زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای چند CTE در یک Statement یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>Recursive CTE و MAXRECURSION\u003c/h3>\n \u003cp>در بحث Recursive CTE و MAXRECURSION، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>مقایسه CTE، temp table و derived table\u003c/h3>\n \u003cp>مقایسه CTE، temp table و derived table حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">WITH\u003c/span> MonthlySales \u003cspan class=\"keyword\">AS\u003c/span> (\n  \u003cspan class=\"keyword\">SELECT\u003c/span> DATEFROMPARTS(YEAR(OrderDate), MONTH(OrderDate), \u003cspan class=\"number\">1\u003c/span>) \u003cspan class=\"keyword\">AS\u003c/span> MonthStart, SUM(TotalDue) \u003cspan class=\"keyword\">AS\u003c/span> Revenue\n  \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">GROUP\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> DATEFROMPARTS(YEAR(OrderDate), MONTH(OrderDate), \u003cspan class=\"number\">1\u003c/span>)\n), Ranked \u003cspan class=\"keyword\">AS\u003c/span> (\n  \u003cspan class=\"keyword\">SELECT\u003c/span> *, DENSE_RANK() \u003cspan class=\"keyword\">OVER\u003c/span> (\u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> Revenue DESC) \u003cspan class=\"keyword\">AS\u003c/span> RevenueRank \u003cspan class=\"keyword\">FROM\u003c/span> MonthlySales\n)\n\u003cspan class=\"keyword\">SELECT\u003c/span> * \u003cspan class=\"keyword\">FROM\u003c/span> Ranked \u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> MonthStart;\u003c/div>","contentEn":"\n \u003cp>This chapter examines WITH syntax and readability from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>WITH syntax and readability\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>multiple CTEs in one statement\u003c/h3>\n \u003cp>multiple CTEs in one statement becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for multiple CTEs in one statement: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>recursive CTEs and MAXRECURSION\u003c/h3>\n \u003cp>When working with recursive CTEs and MAXRECURSION, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>CTEs versus temp tables and derived tables\u003c/h3>\n \u003cp>CTEs versus temp tables and derived tables connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">WITH\u003c/span> MonthlySales \u003cspan class=\"keyword\">AS\u003c/span> (\n  \u003cspan class=\"keyword\">SELECT\u003c/span> DATEFROMPARTS(YEAR(OrderDate), MONTH(OrderDate), \u003cspan class=\"number\">1\u003c/span>) \u003cspan class=\"keyword\">AS\u003c/span> MonthStart, SUM(TotalDue) \u003cspan class=\"keyword\">AS\u003c/span> Revenue\n  \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">GROUP\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> DATEFROMPARTS(YEAR(OrderDate), MONTH(OrderDate), \u003cspan class=\"number\">1\u003c/span>)\n), Ranked \u003cspan class=\"keyword\">AS\u003c/span> (\n  \u003cspan class=\"keyword\">SELECT\u003c/span> *, DENSE_RANK() \u003cspan class=\"keyword\">OVER\u003c/span> (\u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> Revenue DESC) \u003cspan class=\"keyword\">AS\u003c/span> RevenueRank \u003cspan class=\"keyword\">FROM\u003c/span> MonthlySales\n)\n\u003cspan class=\"keyword\">SELECT\u003c/span> * \u003cspan class=\"keyword\">FROM\u003c/span> Ranked \u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> MonthStart;\u003c/div>"},{"id":16,"titleFa":"جدول‌های موقت","titleEn":"Temporary Tables","tag":"cte","topicsFa":["جدول محلی #temp و سراسری ##temp","متغیر جدولی @table","ایندکس و آمار در ساختارهای موقت","TempDB، scope و recompile"],"topicsEn":["local #temp and global ##temp tables","@table variables","indexes and statistics on temporary structures","TempDB, scope, and recompilation"],"contentFa":"\n \u003cp>این فصل جدول محلی #temp و سراسری ##temp را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>جدول محلی #temp و سراسری ##temp\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>متغیر جدولی @table\u003c/h3>\n \u003cp>متغیر جدولی @table زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای متغیر جدولی @table یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>ایندکس و آمار در ساختارهای موقت\u003c/h3>\n \u003cp>در بحث ایندکس و آمار در ساختارهای موقت، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>TempDB، scope و recompile\u003c/h3>\n \u003cp>TempDB، scope و recompile حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ساختار\u003c/th>\u003cth>محدوده\u003c/th>\u003cth>آمار\u003c/th>\u003cth>ایندکس\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>#temp\u003c/td>\u003ctd>Session\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Full\u003c/td>\u003c/tr>\u003ctr>\u003ctd>##temp\u003c/td>\u003ctd>All sessions\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Full\u003c/td>\u003c/tr>\u003ctr>\u003ctd>@table\u003c/td>\u003ctd>Batch/procedure\u003c/td>\u003ctd>Limited/deferred\u003c/td>\u003ctd>Limited\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CTE\u003c/td>\u003ctd>One statement\u003c/td>\u003ctd>Underlying objects\u003c/td>\u003ctd>Underlying objects\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> #RecentOrders (OrderID bigint \u003cspan class=\"keyword\">PRIMARY\u003c/span> \u003cspan class=\"keyword\">KEY\u003c/span>, CustomerID int, TotalDue decimal(\u003cspan class=\"number\">19\u003c/span>,\u003cspan class=\"number\">4\u003c/span>));\n\u003cspan class=\"keyword\">INSERT\u003c/span> #RecentOrders \u003cspan class=\"keyword\">SELECT\u003c/span> OrderID, CustomerID, TotalDue \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">WHERE\u003c/span> OrderDate &gt;= DATEADD(day,-\u003cspan class=\"number\">30\u003c/span>,SYSDATETIME());\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">INDEX\u003c/span> IX_RecentOrders_Customer \u003cspan class=\"keyword\">ON\u003c/span> #RecentOrders(CustomerID) INCLUDE(TotalDue);\u003c/div>","contentEn":"\n \u003cp>This chapter examines local #temp and global ##temp tables from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>local #temp and global ##temp tables\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>@table variables\u003c/h3>\n \u003cp>@table variables becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for @table variables: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>indexes and statistics on temporary structures\u003c/h3>\n \u003cp>When working with indexes and statistics on temporary structures, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>TempDB, scope, and recompilation\u003c/h3>\n \u003cp>TempDB, scope, and recompilation connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Structure\u003c/th>\u003cth>Scope\u003c/th>\u003cth>Statistics\u003c/th>\u003cth>Indexing\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>#temp\u003c/td>\u003ctd>Session\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Full\u003c/td>\u003c/tr>\u003ctr>\u003ctd>##temp\u003c/td>\u003ctd>All sessions\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Full\u003c/td>\u003c/tr>\u003ctr>\u003ctd>@table\u003c/td>\u003ctd>Batch/procedure\u003c/td>\u003ctd>Limited/deferred\u003c/td>\u003ctd>Limited\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CTE\u003c/td>\u003ctd>One statement\u003c/td>\u003ctd>Underlying objects\u003c/td>\u003ctd>Underlying objects\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">TABLE\u003c/span> #RecentOrders (OrderID bigint \u003cspan class=\"keyword\">PRIMARY\u003c/span> \u003cspan class=\"keyword\">KEY\u003c/span>, CustomerID int, TotalDue decimal(\u003cspan class=\"number\">19\u003c/span>,\u003cspan class=\"number\">4\u003c/span>));\n\u003cspan class=\"keyword\">INSERT\u003c/span> #RecentOrders \u003cspan class=\"keyword\">SELECT\u003c/span> OrderID, CustomerID, TotalDue \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">WHERE\u003c/span> OrderDate &gt;= DATEADD(day,-\u003cspan class=\"number\">30\u003c/span>,SYSDATETIME());\n\u003cspan class=\"keyword\">CREATE\u003c/span> \u003cspan class=\"keyword\">INDEX\u003c/span> IX_RecentOrders_Customer \u003cspan class=\"keyword\">ON\u003c/span> #RecentOrders(CustomerID) INCLUDE(TotalDue);\u003c/div>"},{"id":17,"titleFa":"INSERT — درج داده‌ها","titleEn":"INSERT — Adding Data","tag":"dml","topicsFa":["INSERT VALUES و چند ردیف","INSERT SELECT و INSERT EXEC","SELECT INTO، BULK INSERT و OPENROWSET","IDENTITY در برابر SEQUENCE"],"topicsEn":["INSERT VALUES and multi-row inserts","INSERT SELECT and INSERT EXEC","SELECT INTO, BULK INSERT, and OPENROWSET","IDENTITY versus SEQUENCE"],"contentFa":"\n \u003cp>این فصل INSERT VALUES و چند ردیف را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>INSERT VALUES و چند ردیف\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>INSERT SELECT و INSERT EXEC\u003c/h3>\n \u003cp>INSERT SELECT و INSERT EXEC زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای INSERT SELECT و INSERT EXEC یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>SELECT INTO، BULK INSERT و OPENROWSET\u003c/h3>\n \u003cp>در بحث SELECT INTO، BULK INSERT و OPENROWSET، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>IDENTITY در برابر SEQUENCE\u003c/h3>\n \u003cp>IDENTITY در برابر SEQUENCE حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">INSERT\u003c/span> Sales.Customer (CustomerName, Email)\n\u003cspan class=\"keyword\">OUTPUT\u003c/span> inserted.CustomerID, inserted.CustomerName\n\u003cspan class=\"keyword\">VALUES\u003c/span> (N\u003cspan class=\"string\">'شرکت نمونه'\u003c/span>, \u003cspan class=\"string\">'info@example.com'\u003c/span>);\n\n\u003cspan class=\"keyword\">INSERT\u003c/span> Sales.ArchiveOrder (OrderID, OrderDate)\n\u003cspan class=\"keyword\">SELECT\u003c/span> OrderID, OrderDate \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">WHERE\u003c/span> OrderDate &lt; \u003cspan class=\"string\">'\u003cspan class=\"number\">2020\u003c/span>-\u003cspan class=\"number\">01\u003c/span>-\u003cspan class=\"number\">01\u003c/span>'\u003c/span>;\u003c/div>","contentEn":"\n \u003cp>This chapter examines INSERT VALUES and multi-row inserts from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>INSERT VALUES and multi-row inserts\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>INSERT SELECT and INSERT EXEC\u003c/h3>\n \u003cp>INSERT SELECT and INSERT EXEC becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for INSERT SELECT and INSERT EXEC: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>SELECT INTO, BULK INSERT, and OPENROWSET\u003c/h3>\n \u003cp>When working with SELECT INTO, BULK INSERT, and OPENROWSET, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>IDENTITY versus SEQUENCE\u003c/h3>\n \u003cp>IDENTITY versus SEQUENCE connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">INSERT\u003c/span> Sales.Customer (CustomerName, Email)\n\u003cspan class=\"keyword\">OUTPUT\u003c/span> inserted.CustomerID, inserted.CustomerName\n\u003cspan class=\"keyword\">VALUES\u003c/span> (N\u003cspan class=\"string\">'شرکت نمونه'\u003c/span>, \u003cspan class=\"string\">'info@example.com'\u003c/span>);\n\n\u003cspan class=\"keyword\">INSERT\u003c/span> Sales.ArchiveOrder (OrderID, OrderDate)\n\u003cspan class=\"keyword\">SELECT\u003c/span> OrderID, OrderDate \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">WHERE\u003c/span> OrderDate &lt; \u003cspan class=\"string\">'\u003cspan class=\"number\">2020\u003c/span>-\u003cspan class=\"number\">01\u003c/span>-\u003cspan class=\"number\">01\u003c/span>'\u003c/span>;\u003c/div>"},{"id":18,"titleFa":"UPDATE — به‌روزرسانی داده‌ها","titleEn":"UPDATE — Modifying Data","tag":"dml","topicsFa":["UPDATE پایه و محدودسازی دقیق","UPDATE همراه JOIN","UPDATE با CTE و TOP","OUTPUT، ممیزی و ایمنی تراکنش"],"topicsEn":["basic UPDATE and precise targeting","UPDATE with JOIN","UPDATE through CTEs and TOP","OUTPUT, auditing, and transaction safety"],"contentFa":"\n \u003cp>این فصل UPDATE پایه و محدودسازی دقیق را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>UPDATE پایه و محدودسازی دقیق\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>UPDATE همراه JOIN\u003c/h3>\n \u003cp>UPDATE همراه JOIN زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای UPDATE همراه JOIN یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>UPDATE با CTE و TOP\u003c/h3>\n \u003cp>در بحث UPDATE با CTE و TOP، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>OUTPUT، ممیزی و ایمنی تراکنش\u003c/h3>\n \u003cp>OUTPUT، ممیزی و ایمنی تراکنش حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">BEGIN\u003c/span> \u003cspan class=\"keyword\">TRAN\u003c/span>;\n\u003cspan class=\"keyword\">UPDATE\u003c/span> o\n\u003cspan class=\"keyword\">SET\u003c/span> Status = \u003cspan class=\"string\">'Closed'\u003c/span>, ModifiedAt = SYSUTCDATETIME()\n\u003cspan class=\"keyword\">OUTPUT\u003c/span> deleted.Status, inserted.Status, inserted.OrderID\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">AS\u003c/span> o\n\u003cspan class=\"keyword\">WHERE\u003c/span> o.Status = \u003cspan class=\"string\">'Paid'\u003c/span> \u003cspan class=\"keyword\">AND\u003c/span> o.ShippedAt \u003cspan class=\"keyword\">IS\u003c/span> \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>;\n\u003cspan class=\"keyword\">COMMIT\u003c/span>;\u003c/div>","contentEn":"\n \u003cp>This chapter examines basic UPDATE and precise targeting from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>basic UPDATE and precise targeting\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>UPDATE with JOIN\u003c/h3>\n \u003cp>UPDATE with JOIN becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for UPDATE with JOIN: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>UPDATE through CTEs and TOP\u003c/h3>\n \u003cp>When working with UPDATE through CTEs and TOP, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>OUTPUT, auditing, and transaction safety\u003c/h3>\n \u003cp>OUTPUT, auditing, and transaction safety connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">BEGIN\u003c/span> \u003cspan class=\"keyword\">TRAN\u003c/span>;\n\u003cspan class=\"keyword\">UPDATE\u003c/span> o\n\u003cspan class=\"keyword\">SET\u003c/span> Status = \u003cspan class=\"string\">'Closed'\u003c/span>, ModifiedAt = SYSUTCDATETIME()\n\u003cspan class=\"keyword\">OUTPUT\u003c/span> deleted.Status, inserted.Status, inserted.OrderID\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">AS\u003c/span> o\n\u003cspan class=\"keyword\">WHERE\u003c/span> o.Status = \u003cspan class=\"string\">'Paid'\u003c/span> \u003cspan class=\"keyword\">AND\u003c/span> o.ShippedAt \u003cspan class=\"keyword\">IS\u003c/span> \u003cspan class=\"keyword\">NOT\u003c/span> \u003cspan class=\"keyword\">NULL\u003c/span>;\n\u003cspan class=\"keyword\">COMMIT\u003c/span>;\u003c/div>"},{"id":19,"titleFa":"DELETE، TRUNCATE و DROP","titleEn":"DELETE, TRUNCATE & DROP","tag":"dml","topicsFa":["تفاوت DELETE، TRUNCATE و DROP","DELETE همراه JOIN","Soft Delete و فیلتر سراسری","Log، قفل و بازگردانی"],"topicsEn":["DELETE, TRUNCATE, and DROP differences","DELETE with JOIN","soft deletes and global filtering","logging, locking, and rollback"],"contentFa":"\n \u003cp>این فصل تفاوت DELETE، TRUNCATE و DROP را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>تفاوت DELETE، TRUNCATE و DROP\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>DELETE همراه JOIN\u003c/h3>\n \u003cp>DELETE همراه JOIN زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای DELETE همراه JOIN یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>Soft Delete و فیلتر سراسری\u003c/h3>\n \u003cp>در بحث Soft Delete و فیلتر سراسری، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>Log، قفل و بازگردانی\u003c/h3>\n \u003cp>Log، قفل و بازگردانی حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>دستور\u003c/th>\u003cth>ثبت در Log\u003c/th>\u003cth>شرط WHERE\u003c/th>\u003cth>بقای ساختار\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DELETE\u003c/td>\u003ctd>Row operations\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TRUNCATE\u003c/td>\u003ctd>Page deallocation\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DROP\u003c/td>\u003ctd>Object removal\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">UPDATE\u003c/span> Sales.Customer \u003cspan class=\"keyword\">SET\u003c/span> IsDeleted = \u003cspan class=\"number\">1\u003c/span>, DeletedAt = SYSUTCDATETIME() \u003cspan class=\"keyword\">WHERE\u003c/span> CustomerID = @CustomerID;\n\n\u003cspan class=\"keyword\">DELETE\u003c/span> ol\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.OrderLine \u003cspan class=\"keyword\">AS\u003c/span> ol\n\u003cspan class=\"keyword\">JOIN\u003c/span> Sales.Orders \u003cspan class=\"keyword\">AS\u003c/span> o \u003cspan class=\"keyword\">ON\u003c/span> o.OrderID = ol.OrderID\n\u003cspan class=\"keyword\">WHERE\u003c/span> o.OrderDate &lt; DATEADD(year,-\u003cspan class=\"number\">7\u003c/span>,SYSDATETIME());\u003c/div>","contentEn":"\n \u003cp>This chapter examines DELETE, TRUNCATE, and DROP differences from the perspective of a working SQL Server professional. The goal is not merely to memorize sy
