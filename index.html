slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> CustomerID, OrderDate, TotalDue,\n ROW_NUMBER() \u003cspan class=\"keyword\">OVER\u003c/span>(\u003cspan class=\"keyword\">PARTITION\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> CustomerID \u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> OrderDate) \u003cspan class=\"keyword\">AS\u003c/span> OrderNo,\n LAG(TotalDue) \u003cspan class=\"keyword\">OVER\u003c/span>(\u003cspan class=\"keyword\">PARTITION\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> CustomerID \u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> OrderDate) \u003cspan class=\"keyword\">AS\u003c/span> PreviousTotal,\n SUM(TotalDue) \u003cspan class=\"keyword\">OVER\u003c/span>(\u003cspan class=\"keyword\">PARTITION\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> CustomerID \u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> OrderDate \u003cspan class=\"keyword\">ROWS\u003c/span> UNBOUNDED PRECEDING) \u003cspan class=\"keyword\">AS\u003c/span> RunningTotal\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders;\u003c/div>"},{"id":45,"titleFa":"PIVOT و UNPIVOT","titleEn":"PIVOT & UNPIVOT","tag":"analytics","topicsFa":["Pivot ثابت","Pivot پویا و QUOTENAME","UNPIVOT برای تبدیل ستون به ردیف","Conditional Aggregation به‌عنوان جایگزین"],"topicsEn":["static pivots","dynamic pivots and QUOTENAME","UNPIVOT for columns-to-rows transformation","conditional aggregation as an alternative"],"contentFa":"\n \u003cp>این فصل Pivot ثابت را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>Pivot ثابت\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>Pivot پویا و QUOTENAME\u003c/h3>\n \u003cp>Pivot پویا و QUOTENAME زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای Pivot پویا و QUOTENAME یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>UNPIVOT برای تبدیل ستون به ردیف\u003c/h3>\n \u003cp>در بحث UNPIVOT برای تبدیل ستون به ردیف، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>Conditional Aggregation به‌عنوان جایگزین\u003c/h3>\n \u003cp>Conditional Aggregation به‌عنوان جایگزین حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> ProductID,[\u003cspan class=\"number\">2024\u003c/span>],[\u003cspan class=\"number\">2025\u003c/span>],[\u003cspan class=\"number\">2026\u003c/span>]\n\u003cspan class=\"keyword\">FROM\u003c/span> (\u003cspan class=\"keyword\">SELECT\u003c/span> ProductID,YEAR(OrderDate) \u003cspan class=\"keyword\">AS\u003c/span> Y,Amount \u003cspan class=\"keyword\">FROM\u003c/span> Sales.SalesFact) s\n\u003cspan class=\"keyword\">PIVOT\u003c/span>(SUM(Amount) \u003cspan class=\"keyword\">FOR\u003c/span> Y \u003cspan class=\"keyword\">IN\u003c/span> ([\u003cspan class=\"number\">2024\u003c/span>],[\u003cspan class=\"number\">2025\u003c/span>],[\u003cspan class=\"number\">2026\u003c/span>])) p;\u003c/div>","contentEn":"\n \u003cp>This chapter examines static pivots from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>static pivots\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>dynamic pivots and QUOTENAME\u003c/h3>\n \u003cp>dynamic pivots and QUOTENAME becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for dynamic pivots and QUOTENAME: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>UNPIVOT for columns-to-rows transformation\u003c/h3>\n \u003cp>When working with UNPIVOT for columns-to-rows transformation, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>conditional aggregation as an alternative\u003c/h3>\n \u003cp>conditional aggregation as an alternative connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> ProductID,[\u003cspan class=\"number\">2024\u003c/span>],[\u003cspan class=\"number\">2025\u003c/span>],[\u003cspan class=\"number\">2026\u003c/span>]\n\u003cspan class=\"keyword\">FROM\u003c/span> (\u003cspan class=\"keyword\">SELECT\u003c/span> ProductID,YEAR(OrderDate) \u003cspan class=\"keyword\">AS\u003c/span> Y,Amount \u003cspan class=\"keyword\">FROM\u003c/span> Sales.SalesFact) s\n\u003cspan class=\"keyword\">PIVOT\u003c/span>(SUM(Amount) \u003cspan class=\"keyword\">FOR\u003c/span> Y \u003cspan class=\"keyword\">IN\u003c/span> ([\u003cspan class=\"number\">2024\u003c/span>],[\u003cspan class=\"number\">2025\u003c/span>],[\u003cspan class=\"number\">2026\u003c/span>])) p;\u003c/div>"},{"id":46,"titleFa":"JSON در SQL Server","titleEn":"JSON in SQL Server","tag":"analytics","topicsFa":["FOR JSON PATH و AUTO","OPENJSON و WITH","JSON_VALUE، JSON_QUERY و JSON_MODIFY","اعتبارسنجی و ایندکس JSON"],"topicsEn":["FOR JSON PATH and AUTO","OPENJSON and WITH","JSON_VALUE, JSON_QUERY, and JSON_MODIFY","JSON validation and indexing"],"contentFa":"\n \u003cp>این فصل FOR JSON PATH و AUTO را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>FOR JSON PATH و AUTO\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>OPENJSON و WITH\u003c/h3>\n \u003cp>OPENJSON و WITH زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای OPENJSON و WITH یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>JSON_VALUE، JSON_QUERY و JSON_MODIFY\u003c/h3>\n \u003cp>در بحث JSON_VALUE، JSON_QUERY و JSON_MODIFY، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>اعتبارسنجی و ایندکس JSON\u003c/h3>\n \u003cp>اعتبارسنجی و ایندکس JSON حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> OrderID, CustomerID, TotalDue \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">FOR\u003c/span> \u003cspan class=\"keyword\">JSON\u003c/span> PATH, ROOT(\u003cspan class=\"string\">'orders'\u003c/span>);\n\u003cspan class=\"keyword\">SELECT\u003c/span> j.ProductID,j.Quantity\n\u003cspan class=\"keyword\">FROM\u003c/span> OPENJSON(@payload,\u003cspan class=\"string\">'$.lines'\u003c/span>) \u003cspan class=\"keyword\">WITH\u003c/span>(ProductID int \u003cspan class=\"string\">'$.id'\u003c/span>,Quantity int \u003cspan class=\"string\">'$.qty'\u003c/span>) j;\u003c/div>","contentEn":"\n \u003cp>This chapter examines FOR JSON PATH and AUTO from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>FOR JSON PATH and AUTO\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>OPENJSON and WITH\u003c/h3>\n \u003cp>OPENJSON and WITH becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for OPENJSON and WITH: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>JSON_VALUE, JSON_QUERY, and JSON_MODIFY\u003c/h3>\n \u003cp>When working with JSON_VALUE, JSON_QUERY, and JSON_MODIFY, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>JSON validation and indexing\u003c/h3>\n \u003cp>JSON validation and indexing connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> OrderID, CustomerID, TotalDue \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">FOR\u003c/span> \u003cspan class=\"keyword\">JSON\u003c/span> PATH, ROOT(\u003cspan class=\"string\">'orders'\u003c/span>);\n\u003cspan class=\"keyword\">SELECT\u003c/span> j.ProductID,j.Quantity\n\u003cspan class=\"keyword\">FROM\u003c/span> OPENJSON(@payload,\u003cspan class=\"string\">'$.lines'\u003c/span>) \u003cspan class=\"keyword\">WITH\u003c/span>(ProductID int \u003cspan class=\"string\">'$.id'\u003c/span>,Quantity int \u003cspan class=\"string\">'$.qty'\u003c/span>) j;\u003c/div>"},{"id":47,"titleFa":"XML در SQL Server","titleEn":"XML in SQL Server","tag":"analytics","topicsFa":["FOR XML RAW، AUTO و PATH","XQuery و متدهای value، query و nodes","XML Index","مقایسه XML و JSON"],"topicsEn":["FOR XML RAW, AUTO, and PATH","XQuery and value, query, and nodes methods","XML indexes","XML versus JSON"],"contentFa":"\n \u003cp>این فصل FOR XML RAW، AUTO و PATH را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>FOR XML RAW، AUTO و PATH\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>XQuery و متدهای value، query و nodes\u003c/h3>\n \u003cp>XQuery و متدهای value، query و nodes زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای XQuery و متدهای value، query و nodes یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>XML Index\u003c/h3>\n \u003cp>در بحث XML Index، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>مقایسه XML و JSON\u003c/h3>\n \u003cp>مقایسه XML و JSON حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>قالب\u003c/th>\u003cth>نقطه قوت\u003c/th>\u003cth>مصالحه\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>JSON\u003c/td>\u003ctd>Web APIs, compact payload\u003c/td>\u003ctd>No native JSON type in classic SQL Server\u003c/td>\u003c/tr>\u003ctr>\u003ctd>XML\u003c/td>\u003ctd>Schema, XQuery, typed data\u003c/td>\u003ctd>More verbose\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Relational\u003c/td>\u003ctd>Joins, constraints, indexing\u003c/td>\u003ctd>Needs stable schema\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> OrderID, CustomerID \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">FOR\u003c/span> \u003cspan class=\"keyword\">XML\u003c/span> PATH(\u003cspan class=\"string\">'\u003cspan class=\"keyword\">order\u003c/span>'\u003c/span>), ROOT(\u003cspan class=\"string\">'orders'\u003c/span>), \u003cspan class=\"keyword\">TYPE\u003c/span>;\n\u003cspan class=\"keyword\">SELECT\u003c/span> x.n.value(\u003cspan class=\"string\">'(ProductID/text())[\u003cspan class=\"number\">1\u003c/span>]'\u003c/span>,\u003cspan class=\"string\">'int'\u003c/span>) \u003cspan class=\"keyword\">AS\u003c/span> ProductID\n\u003cspan class=\"keyword\">FROM\u003c/span> @doc.nodes(\u003cspan class=\"string\">'/\u003cspan class=\"keyword\">order\u003c/span>/line'\u003c/span>) x(n);\u003c/div>","contentEn":"\n \u003cp>This chapter examines FOR XML RAW, AUTO, and PATH from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>FOR XML RAW, AUTO, and PATH\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>XQuery and value, query, and nodes methods\u003c/h3>\n \u003cp>XQuery and value, query, and nodes methods becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for XQuery and value, query, and nodes methods: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>XML indexes\u003c/h3>\n \u003cp>When working with XML indexes, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>XML versus JSON\u003c/h3>\n \u003cp>XML versus JSON connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Format\u003c/th>\u003cth>Strength\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>JSON\u003c/td>\u003ctd>Web APIs, compact payload\u003c/td>\u003ctd>No native JSON type in classic SQL Server\u003c/td>\u003c/tr>\u003ctr>\u003ctd>XML\u003c/td>\u003ctd>Schema, XQuery, typed data\u003c/td>\u003ctd>More verbose\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Relational\u003c/td>\u003ctd>Joins, constraints, indexing\u003c/td>\u003ctd>Needs stable schema\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> OrderID, CustomerID \u003cspan class=\"keyword\">FROM\u003c/span> Sales.Orders \u003cspan class=\"keyword\">FOR\u003c/span> \u003cspan class=\"keyword\">XML\u003c/span> PATH(\u003cspan class=\"string\">'\u003cspan class=\"keyword\">order\u003c/span>'\u003c/span>), ROOT(\u003cspan class=\"string\">'orders'\u003c/span>), \u003cspan class=\"keyword\">TYPE\u003c/span>;\n\u003cspan class=\"keyword\">SELECT\u003c/span> x.n.value(\u003cspan class=\"string\">'(ProductID/text())[\u003cspan class=\"number\">1\u003c/span>]'\u003c/span>,\u003cspan class=\"string\">'int'\u003c/span>) \u003cspan class=\"keyword\">AS\u003c/span> ProductID\n\u003cspan class=\"keyword\">FROM\u003c/span> @doc.nodes(\u003cspan class=\"string\">'/\u003cspan class=\"keyword\">order\u003c/span>/line'\u003c/span>) x(n);\u003c/div>"},{"id":48,"titleFa":"سناریوی عملی: سیستم مدیریت فروش","titleEn":"Practical Scenario: Sales Management","tag":"scenario","topicsFa":["طراحی ERD مشتری، سفارش، محصول و پرداخت","داده نمونه و محدودیت‌ها","بیش از بیست الگوی کوئری عملی","گزارش فروش، موجودی و مشتری"],"topicsEn":["an ERD for customers, orders, products, and payments","sample data and constraints","more than twenty practical query patterns","sales, inventory, and customer reporting"],"contentFa":"\u003ch3>ERD متنی\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>جدول\u003c/th>\u003cth>کلید\u003c/th>\u003cth>رابطه\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Customer\u003c/td>\u003ctd>CustomerID\u003c/td>\u003ctd>یک به چند با Order\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Order\u003c/td>\u003ctd>OrderID\u003c/td>\u003ctd>یک به چند با OrderLine و Payment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Product\u003c/td>\u003ctd>ProductID\u003c/td>\u003ctd>یک به چند با OrderLine\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OrderLine\u003c/td>\u003ctd>OrderID + LineNo\u003c/td>\u003ctd>پل Order و Product\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>۲۲ پرسش واقعی برای توسعه\u003c/h3>\u003col class=\"query-list\">\u003cli>فروش روزانه\u003c/li>\u003cli>فروش ماهانه\u003c/li>\u003cli>پرفروش‌ترین محصول\u003c/li>\u003cli>کم‌فروش‌ترین محصول\u003c/li>\u003cli>مشتریان غیرفعال\u003c/li>\u003cli>ارزش طول عمر مشتری\u003c/li>\u003cli>میانگین سبد\u003c/li>\u003cli>نرخ بازگشت\u003c/li>\u003cli>سفارش‌های ناقص\u003c/li>\u003cli>موجودی بحرانی\u003c/li>\u003cli>گردش موجودی\u003c/li>\u003cli>فروشنده برتر\u003c/li>\u003cli>رشد سالانه\u003c/li>\u003cli>رشد ماهانه\u003c/li>\u003cli>سهم دسته محصول\u003c/li>\u003cli>تخفیف موثر\u003c/li>\u003cli>پرداخت معوق\u003c/li>\u003cli>زمان ارسال\u003c/li>\u003cli>خرید تکراری\u003c/li>\u003cli>هم‌بستگی محصول\u003c/li>\u003cli>پیش‌بینی ساده تقاضا\u003c/li>\u003cli>کنترل مغایرت مالی\u003c/li>\u003c/ol>\n \u003cp>این فصل طراحی ERD مشتری، سفارش، محصول و پرداخت را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>طراحی ERD مشتری، سفارش، محصول و پرداخت\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>داده نمونه و محدودیت‌ها\u003c/h3>\n \u003cp>داده نمونه و محدودیت‌ها زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای داده نمونه و محدودیت‌ها یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>بیش از بیست الگوی کوئری عملی\u003c/h3>\n \u003cp>در بحث بیش از بیست الگوی کوئری عملی، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>گزارش فروش، موجودی و مشتری\u003c/h3>\n \u003cp>گزارش فروش، موجودی و مشتری حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"keyword\">TOP\u003c/span> (\u003cspan class=\"number\">20\u003c/span>) p.ProductID,p.Name,SUM(ol.Quantity) \u003cspan class=\"keyword\">AS\u003c/span> Units,SUM(ol.Quantity*ol.UnitPrice) \u003cspan class=\"keyword\">AS\u003c/span> Revenue\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.OrderLine ol \u003cspan class=\"keyword\">JOIN\u003c/span> Production.Product p \u003cspan class=\"keyword\">ON\u003c/span> p.ProductID=ol.ProductID\n\u003cspan class=\"keyword\">JOIN\u003c/span> Sales.Orders o \u003cspan class=\"keyword\">ON\u003c/span> o.OrderID=ol.OrderID\n\u003cspan class=\"keyword\">WHERE\u003c/span> o.OrderDate&gt;=DATEADD(day,-\u003cspan class=\"number\">90\u003c/span>,SYSDATETIME())\n\u003cspan class=\"keyword\">GROUP\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> p.ProductID,p.Name \u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> Revenue DESC;\u003c/div>","contentEn":"\u003ch3>Text ERD\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Table\u003c/th>\u003cth>Key\u003c/th>\u003cth>Relationship\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Customer\u003c/td>\u003ctd>CustomerID\u003c/td>\u003ctd>One-to-many with Order\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Order\u003c/td>\u003ctd>OrderID\u003c/td>\u003ctd>One-to-many with OrderLine and Payment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Product\u003c/td>\u003ctd>ProductID\u003c/td>\u003ctd>One-to-many with OrderLine\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OrderLine\u003c/td>\u003ctd>OrderID + LineNo\u003c/td>\u003ctd>Bridge between Order and Product\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>22 real query assignments\u003c/h3>\u003col class=\"query-list\">\u003cli>daily sales\u003c/li>\u003cli>monthly sales\u003c/li>\u003cli>best-selling product\u003c/li>\u003cli>slowest product\u003c/li>\u003cli>inactive customers\u003c/li>\u003cli>customer lifetime value\u003c/li>\u003cli>average basket\u003c/li>\u003cli>return rate\u003c/li>\u003cli>incomplete orders\u003c/li>\u003cli>critical inventory\u003c/li>\u003cli>inventory turnover\u003c/li>\u003cli>top salesperson\u003c/li>\u003cli>year-over-year growth\u003c/li>\u003cli>month-over-month growth\u003c/li>\u003cli>category share\u003c/li>\u003cli>effective discount\u003c/li>\u003cli>overdue payments\u003c/li>\u003cli>shipping latency\u003c/li>\u003cli>repeat purchase\u003c/li>\u003cli>product affinity\u003c/li>\u003cli>simple demand forecast\u003c/li>\u003cli>financial reconciliation\u003c/li>\u003c/ol>\n \u003cp>This chapter examines an ERD for customers, orders, products, and payments from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>an ERD for customers, orders, products, and payments\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>sample data and constraints\u003c/h3>\n \u003cp>sample data and constraints becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for sample data and constraints: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>more than twenty practical query patterns\u003c/h3>\n \u003cp>When working with more than twenty practical query patterns, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>sales, inventory, and customer reporting\u003c/h3>\n \u003cp>sales, inventory, and customer reporting connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> \u003cspan class=\"keyword\">TOP\u003c/span> (\u003cspan class=\"number\">20\u003c/span>) p.ProductID,p.Name,SUM(ol.Quantity) \u003cspan class=\"keyword\">AS\u003c/span> Units,SUM(ol.Quantity*ol.UnitPrice) \u003cspan class=\"keyword\">AS\u003c/span> Revenue\n\u003cspan class=\"keyword\">FROM\u003c/span> Sales.OrderLine ol \u003cspan class=\"keyword\">JOIN\u003c/span> Production.Product p \u003cspan class=\"keyword\">ON\u003c/span> p.ProductID=ol.ProductID\n\u003cspan class=\"keyword\">JOIN\u003c/span> Sales.Orders o \u003cspan class=\"keyword\">ON\u003c/span> o.OrderID=ol.OrderID\n\u003cspan class=\"keyword\">WHERE\u003c/span> o.OrderDate&gt;=DATEADD(day,-\u003cspan class=\"number\">90\u003c/span>,SYSDATETIME())\n\u003cspan class=\"keyword\">GROUP\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> p.ProductID,p.Name \u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> Revenue DESC;\u003c/div>"},{"id":49,"titleFa":"سناریوی عملی: تحلیل لاگ و ورود","titleEn":"Practical Scenario: Log & Login Analytics","tag":"scenario","topicsFa":["طراحی جدول رخداد حجیم","Partitioning زمانی","Window Function برای Sessionization","عیب‌یابی و بهینه‌سازی مرحله‌به‌مرحله"],"topicsEn":["designing a high-volume event table","time-based partitioning","window functions for sessionization","step-by-step diagnosis and optimization"],"contentFa":"\n \u003cp>این فصل طراحی جدول رخداد حجیم را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>طراحی جدول رخداد حجیم\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>Partitioning زمانی\u003c/h3>\n \u003cp>Partitioning زمانی زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای Partitioning زمانی یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>Window Function برای Sessionization\u003c/h3>\n \u003cp>در بحث Window Function برای Sessionization، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>عیب‌یابی و بهینه‌سازی مرحله‌به‌مرحله\u003c/h3>\n \u003cp>عیب‌یابی و بهینه‌سازی مرحله‌به‌مرحله حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">WITH\u003c/span> E \u003cspan class=\"keyword\">AS\u003c/span> (\u003cspan class=\"keyword\">SELECT\u003c/span> UserID,EventTime,\n \u003cspan class=\"keyword\">CASE\u003c/span> \u003cspan class=\"keyword\">WHEN\u003c/span> DATEDIFF(minute,LAG(EventTime) \u003cspan class=\"keyword\">OVER\u003c/span>(\u003cspan class=\"keyword\">PARTITION\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> UserID \u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> EventTime),EventTime)&gt;\u003cspan class=\"number\">30\u003c/span> \u003cspan class=\"keyword\">THEN\u003c/span> \u003cspan class=\"number\">1\u003c/span> \u003cspan class=\"keyword\">ELSE\u003c/span> \u003cspan class=\"number\">0\u003c/span> \u003cspan class=\"keyword\">END\u003c/span> \u003cspan class=\"keyword\">AS\u003c/span> NewSession\n \u003cspan class=\"keyword\">FROM\u003c/span> Log.LoginEvent), S \u003cspan class=\"keyword\">AS\u003c/span> (\u003cspan class=\"keyword\">SELECT\u003c/span> *,SUM(NewSession) \u003cspan class=\"keyword\">OVER\u003c/span>(\u003cspan class=\"keyword\">PARTITION\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> UserID \u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> EventTime) \u003cspan class=\"keyword\">AS\u003c/span> SessionId \u003cspan class=\"keyword\">FROM\u003c/span> E)\n\u003cspan class=\"keyword\">SELECT\u003c/span> UserID,SessionId,MIN(EventTime) StartAt,MAX(EventTime) EndAt \u003cspan class=\"keyword\">FROM\u003c/span> S \u003cspan class=\"keyword\">GROUP\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> UserID,SessionId;\u003c/div>","contentEn":"\n \u003cp>This chapter examines designing a high-volume event table from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>designing a high-volume event table\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview the target with a narrowly scoped SELECT, use an explicit transaction where appropriate, and retain a tested recovery path. Check the server version and database compatibility level as well: a feature present in SQL Server 2022 may not be enabled in a database operating at an older compatibility level.\u003c/p>\n \u003ch3>time-based partitioning\u003c/h3>\n \u003cp>time-based partitioning becomes useful when it is connected to a business requirement. A sales platform, for example, needs correct results, predictable response times, and trustworthy auditing. Its design must tolerate growth, concurrent users, partial failure, and recovery. Measurements from \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>, Query Store, and execution plans are more reliable than intuition. Test with production-like volume and distribution because a query that looks excellent on one thousand rows may fail badly on one hundred million.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 Professional tip\u003c/strong>\u003cp>Define a measurable target for time-based partitioning: logical reads, CPU time, elapsed time, estimated versus actual rows, blocking duration, or log volume. Without a baseline, a change can simply move cost from one subsystem to another.\u003c/p>\u003c/div>\n \u003ch3>window functions for sessionization\u003c/h3>\n \u003cp>When working with window functions for sessionization, maintainability is a performance feature. Clear names, explicit schemas, meaningful aliases, and short comments make intent visible to the next engineer. Avoid \u003ccode>SELECT *\u003c/code> in stable application contracts, align parameter types with column types, and watch for implicit conversions. A conversion applied to the indexed column can turn a seek into a scan, multiplying CPU and I/O while still returning the correct answer.\u003c/p>\n \u003cp>The optimizer builds a plan from statistics and its cost model, not from the author's intention. Stale statistics, skewed values, parameter sniffing, or a non-SARGable predicate can therefore produce a weak plan. A professional response is not to add a hint immediately. First establish the cause with an actual plan, runtime metrics, Query Store history, and waits. Then apply the least risky correction and test representative parameter values.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ Common mistake\u003c/strong>\u003cp>Typical failures include executing examples directly in production, connecting an application as \u003ccode>sysadmin\u003c/code>, and adding indexes without measuring write amplification. A safe test environment, verified backups, code review, and least privilege are part of the technical solution.\u003c/p>\u003c/div>\n \u003ch3>step-by-step diagnosis and optimization\u003c/h3>\n \u003cp>step-by-step diagnosis and optimization connects this topic to the wider system architecture. A database decision must be evaluated with the application's transaction pattern, service-level objectives, backup policy, security model, and observability. Raising isolation may improve read consistency but increase blocking. A covering index may accelerate one report while consuming storage and slowing every insert. There is no context-free best choice; workload evidence and documented trade-offs decide.\u003c/p>\n \u003cp>Keep changes small, repeatable, reviewable, and reversible. Store scripts in source control, record before-and-after evidence, mask sensitive test data, and grant only the permissions required. Microsoft Learn should be your primary reference for exact syntax and version behavior. Itzik Ben-Gan's writing is an excellent companion for set-based reasoning, logical query processing, and window functions.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ Operational checklist\u003c/strong>\u003cp>State the goal; capture a baseline; execute in a safe environment; test edge cases and NULL behavior; review concurrency and security; measure again; document the decision and rollback plan.\u003c/p>\u003c/div>\n \u003ch3>🎯 Exercise\u003c/h3>\n \u003cp>Create a practice database with at least one hundred thousand rows and run the example on this page. Apply one justified change—an index, a rewritten predicate, a new constraint, or a corrected data type. Record logical reads, elapsed time, and the plan before and after. Explain the mechanism behind the result and identify remaining production risk. Cross-reference the architecture, indexing, transactions, and execution-plan chapters of this book.\u003c/p>\u003ch3>Runnable example\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">WITH\u003c/span> E \u003cspan class=\"keyword\">AS\u003c/span> (\u003cspan class=\"keyword\">SELECT\u003c/span> UserID,EventTime,\n \u003cspan class=\"keyword\">CASE\u003c/span> \u003cspan class=\"keyword\">WHEN\u003c/span> DATEDIFF(minute,LAG(EventTime) \u003cspan class=\"keyword\">OVER\u003c/span>(\u003cspan class=\"keyword\">PARTITION\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> UserID \u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> EventTime),EventTime)&gt;\u003cspan class=\"number\">30\u003c/span> \u003cspan class=\"keyword\">THEN\u003c/span> \u003cspan class=\"number\">1\u003c/span> \u003cspan class=\"keyword\">ELSE\u003c/span> \u003cspan class=\"number\">0\u003c/span> \u003cspan class=\"keyword\">END\u003c/span> \u003cspan class=\"keyword\">AS\u003c/span> NewSession\n \u003cspan class=\"keyword\">FROM\u003c/span> Log.LoginEvent), S \u003cspan class=\"keyword\">AS\u003c/span> (\u003cspan class=\"keyword\">SELECT\u003c/span> *,SUM(NewSession) \u003cspan class=\"keyword\">OVER\u003c/span>(\u003cspan class=\"keyword\">PARTITION\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> UserID \u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> EventTime) \u003cspan class=\"keyword\">AS\u003c/span> SessionId \u003cspan class=\"keyword\">FROM\u003c/span> E)\n\u003cspan class=\"keyword\">SELECT\u003c/span> UserID,SessionId,MIN(EventTime) StartAt,MAX(EventTime) EndAt \u003cspan class=\"keyword\">FROM\u003c/span> S \u003cspan class=\"keyword\">GROUP\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> UserID,SessionId;\u003c/div>"},{"id":50,"titleFa":"منابع و مسیر یادگیری","titleEn":"Resources & Learning Path","tag":"resources","topicsFa":["کتاب‌های Itzik Ben-Gan و منابع Performance","گواهی‌های DP-300 و DP-900 و وضعیت مدارک قدیمی","Microsoft Learn، SQLskills و Brent Ozar","جامعه‌ها، پروژه نهایی و برنامه تمرین"],"topicsEn":["books by Itzik Ben-Gan and performance resources","DP-300 and DP-900 plus the status of legacy certifications","Microsoft Learn, SQLskills, and Brent Ozar","communities, a capstone project, and a practice plan"],"contentFa":"\u003cdiv class=\"resource-grid\">\u003cdiv>\u003cstrong>کتاب‌ها\u003c/strong>\u003cp>T-SQL Fundamentals نوشته Itzik Ben-Gan؛ SQL Server 2022 Query Performance Tuning.\u003c/p>\u003c/div>\u003cdiv>\u003cstrong>گواهی‌ها\u003c/strong>\u003cp>DP-900 برای مبانی Azure Data و DP-300 برای مدیریت Azure SQL. مدارک MCSA و MCSE بازنشسته شده‌اند اما سرفصل‌های قدیمی هنوز برای مرور مفیدند.\u003c/p>\u003c/div>\u003cdiv>\u003cstrong>آنلاین و جامعه\u003c/strong>\u003cp>Microsoft Learn، SQLskills، Brent Ozar، SQLServerCentral، Stack Overflow و r/SQLServer.\u003c/p>\u003c/div>\u003c/div>\u003cblockquote>«حرفه‌ای شدن نتیجه یک کوئری درخشان نیست؛ حاصل هزار بار مشاهده، اندازه‌گیری، شکست امن و اصلاح آگاهانه است.»\u003c/blockquote>\n \u003cp>این فصل کتاب‌های Itzik Ben-Gan و منابع Performance را از دید یک متخصص SQL Server بررسی می‌کند. هدف فقط حفظ کردن Syntax نیست؛ باید بدانیم موتور پایگاه داده چگونه تصمیم می‌گیرد، داده چگونه نگهداری می‌شود و هر انتخاب چه اثری بر صحت، امنیت و کارایی دارد. هنگام مطالعه، مثال‌ها را در یک Database آزمایشی اجرا کنید، Actual Execution Plan و پیام‌های خطا را بخوانید و نتیجه را با انتظار خود مقایسه کنید. این عادت ساده فاصله میان دانستن دستورها و توانایی حل مسئله واقعی را کم می‌کند.\u003c/p>\n \u003cp>موضوع اول، \u003cstrong>کتاب‌های Itzik Ben-Gan و منابع Performance\u003c/strong>، پایه تصمیم‌های بعدی است. در محیط Production هیچ دستور مهمی را بدون شناخت تعداد ردیف، نوع داده، Constraintها، Indexها و سطح دسترسی اجرا نکنید. ابتدا با یک SELECT محدود دامنه را بسنجید، سپس تغییر را داخل Transaction انجام دهید و برای عملیات حساس راه بازگشت داشته باشید. همچنین رفتار نسخه و Compatibility Level را بررسی کنید؛ قابلیتی که در SQL Server 2022 وجود دارد ممکن است در Database با سطح سازگاری قدیمی فعال نباشد.\u003c/p>\n \u003ch3>گواهی‌های DP-300 و DP-900 و وضعیت مدارک قدیمی\u003c/h3>\n \u003cp>گواهی‌های DP-300 و DP-900 و وضعیت مدارک قدیمی زمانی ارزشمند است که با نیاز کسب‌وکار پیوند بخورد. برای نمونه، یک سامانه فروش به پاسخ درست، زمان پاسخ قابل پیش‌بینی و Audit قابل اعتماد نیاز دارد. طراحی باید برای رشد داده، اجرای همزمان چند کاربر و بازیابی پس از خطا آماده باشد. اندازه‌گیری با \u003ccode>SET STATISTICS IO, TIME ON\u003c/code>، Query Store و Execution Plan بهتر از حدس است. هر بهینه‌سازی را با داده‌ای شبیه Production آزمایش کنید، زیرا یک کوئری روی هزار ردیف می‌تواند عالی و روی صد میلیون ردیف نامناسب باشد.\u003c/p>\n \u003cdiv class=\"info-box tip\">\u003cstrong>💡 نکته حرفه‌ای\u003c/strong>\u003cp>برای گواهی‌های DP-300 و DP-900 و وضعیت مدارک قدیمی یک معیار قابل اندازه‌گیری تعریف کنید: Logical Read، CPU، مدت اجرا، تعداد ردیف تخمینی و واقعی، یا میزان Blocking. تغییر بدون Baseline ممکن است فقط هزینه را از یک بخش به بخش دیگر منتقل کند.\u003c/p>\u003c/div>\n \u003ch3>Microsoft Learn، SQLskills و Brent Ozar\u003c/h3>\n \u003cp>در بحث Microsoft Learn، SQLskills و Brent Ozar، خوانایی و قابلیت نگهداری هم‌ارز سرعت‌اند. نام‌گذاری روشن، Schema مشخص، Alias معنادار و Comment کوتاه باعث می‌شود نفر بعدی قصد کد را بفهمد. از \u003ccode>SELECT *\u003c/code> در قراردادهای پایدار برنامه پرهیز کنید، نوع داده پارامتر را با ستون هماهنگ نگه دارید و تبدیل ضمنی را جدی بگیرید. تبدیل روی سمت ستون می‌تواند Index Seek را به Scan تبدیل کند و مصرف CPU و I/O را چند برابر سازد.\u003c/p>\n \u003cp>Optimizer بر اساس آمار و مدل هزینه Plan می‌سازد، نه بر اساس نیت برنامه‌نویس. بنابراین آمار کهنه، توزیع نامتوازن داده، Parameter Sniffing یا Predicate غیر SARGable می‌تواند Plan ضعیف تولید کند. راه‌حل حرفه‌ای همیشه افزودن Hint نیست؛ نخست علت را با Actual Plan، Runtime Statistics و Waitها پیدا کنید. سپس کم‌خطرترین تغییر را انتخاب و اثر آن را در چند شکل پارامتر بسنجید.\u003c/p>\n \u003cdiv class=\"info-box warning\">\u003cstrong>⚠️ اشتباه رایج\u003c/strong>\u003cp>اجرای مستقیم مثال‌ها روی Production، استفاده از حساب \u003ccode>sysadmin\u003c/code> برای برنامه، یا افزودن Index بدون بررسی هزینه نوشتن. نسخه آزمایشی، Backup معتبر و اصل Least Privilege بخشی از خود راه‌حل هستند.\u003c/p>\u003c/div>\n \u003ch3>جامعه‌ها، پروژه نهایی و برنامه تمرین\u003c/h3>\n \u003cp>جامعه‌ها، پروژه نهایی و برنامه تمرین حلقه اتصال این فصل به معماری کل سامانه است. تصمیم Database باید همراه با الگوی تراکنش برنامه، SLA، سیاست Backup، امنیت و مشاهده‌پذیری بررسی شود. برای مثال، افزایش Isolation ممکن است صحت خواندن را بهتر کند اما Blocking را افزایش دهد؛ یک Index پوششی خواندن را سریع می‌کند اما فضای ذخیره‌سازی و هزینه INSERT را بالا می‌برد. پاسخ درست وابسته به بارکاری است و باید مستند شود.\u003c/p>\n \u003cp>بهترین Practice این است که تغییر را کوچک، قابل تکرار و قابل بازگشت نگه دارید. Script را در Source Control قرار دهید، قبل و بعد از اجرا معیار ثبت کنید، روی داده حساس Masking به‌کار ببرید و مجوز را فقط به عملیات لازم محدود کنید. برای جزئیات رسمی Syntax و تفاوت نسخه‌ها Microsoft Learn مرجع اصلی است؛ برای تفکر مجموعه‌ای و Window Functionها، کتاب‌های Itzik Ben-Gan مکمل بسیار خوبی هستند.\u003c/p>\n \u003cdiv class=\"info-box success\">\u003cstrong>✅ چک‌لیست عملی\u003c/strong>\u003cp>هدف را تعریف کنید؛ داده و Plan پایه را ثبت کنید؛ مثال را در محیط امن اجرا کنید؛ صحت نتیجه را با Edge Case و NULL بسنجید؛ اثر همزمانی و امنیت را بررسی کنید؛ و نتیجه را مستند سازید.\u003c/p>\u003c/div>\n \u003ch3>🎯 تمرین\u003c/h3>\n \u003cp>یک Database آزمایشی با حداقل صد هزار ردیف بسازید و نمونه این صفحه را اجرا کنید. سپس یک تغییر منطقی—مانند Index، بازنویسی Predicate یا تغییر نوع داده—اعمال کنید. Logical Read، مدت اجرا و Plan را پیش و پس از تغییر ثبت کنید. توضیح دهید چرا نتیجه بهتر یا بدتر شد و چه خطری برای محیط Production باقی می‌ماند. برای تکمیل تصویر، به فصل‌های معماری، Index، Transaction و Execution Plan در همین کتاب مراجعه کنید.\u003c/p>\u003ch3>نمونه قابل اجرا\u003c/h3>\u003cdiv class=\"code-block\">\u003cspan class=\"comment\">-- Run \u003cspan class=\"keyword\">in\u003c/span> a test \u003cspan class=\"keyword\">database\u003c/span>\u003c/span>\n\u003cspan class=\"comment\">-- Capstone health \u003cspan class=\"keyword\">check\u003c/span>\u003c/span>\n\u003cspan class=\"keyword\">SELECT\u003c/span> DB_NAME(database_id) \u003cspan class=\"keyword\">AS\u003c/span> DatabaseName,\n       SUM(size)*\u003cspan class=\"number\">8\u003c/span>/\u003cspan class=\"number\">1024\u003c/span> \u003cspan class=\"keyword\">AS\u003c/span> SizeMB\n\u003cspan class=\"keyword\">FROM\u003c/span> sys.master_files\n\u003cspan class=\"keyword\">GROUP\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> database_id\n\u003cspan class=\"keyword\">ORDER\u003c/span> \u003cspan class=\"keyword\">BY\u003c/span> SizeMB DESC;\u003c/div>","contentEn":"\u003cdiv class=\"resource-grid\">\u003cdiv>\u003cstrong>Books\u003c/strong>\u003cp>Itzik Ben-Gan's T-SQL Fundamentals; SQL Server 2022 Query Performance Tuning.\u003c/p>\u003c/div>\u003cdiv>\u003cstrong>Certifications\u003c/strong>\u003cp>DP-900 for Azure data fundamentals and DP-300 for Azure SQL administration. MCSA and MCSE are retired, though their older objective lists remain useful study checklists.\u003c/p>\u003c/div>\u003cdiv>\u003cstrong>Online and community\u003c/strong>\u003cp>Microsoft Learn, SQLskills, Brent Ozar, SQLServerCentral, Stack Overflow, and r/SQLServer.\u003c/p>\u003c/div>\u003c/div>\u003cblockquote>“Professional mastery is not one brilliant query; it is a thousand cycles of observation, measurement, safe failure, and deliberate correction.”\u003c/blockquote>\n \u003cp>This chapter examines books by Itzik Ben-Gan and performance resources from the perspective of a working SQL Server professional. The goal is not merely to memorize syntax. You should understand how the engine makes decisions, how data is represented, and how each choice affects correctness, security, operability, and performance. Run the examples in a disposable database, inspect the actual execution plan and messages, and compare observed behavior with your prediction. That habit closes the gap between knowing commands and solving production problems.\u003c/p>\n \u003cp>The first subject, \u003cstrong>books by Itzik Ben-Gan and performance resources\u003c/strong>, supports the decisions that follow. In production, never run an important statement without understanding its row count, data types, constraints, indexes, and security context. Preview
